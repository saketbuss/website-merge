<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilltop Tank Commander: Infinite War</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #111;
            font-family: 'Black Ops One', cursive, sans-serif; 
            user-select: none; 
            cursor: crosshair;
        }
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600&display=swap');

        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        #scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none; z-index: 50; opacity: 0.8;
        }

        #vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none; z-index: 49;
        }

        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }

        #hud-panel {
            background: rgba(10, 20, 10, 0.75);
            border: 2px solid #5a7d32;
            border-radius: 12px;
            padding: 15px 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 10px rgba(90,125,50,0.5);
            backdrop-filter: blur(8px);
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 10px;
            transition: transform 0.1s;
        }

        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 1.8rem; min-width: 220px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .stat-label { color: #aaa; font-family: 'Teko', sans-serif; font-size: 1.5rem; letter-spacing: 1px; }
        .stat-value.kills { color: #ff5252; text-shadow: 0 0 10px rgba(255,82,82,0.5); }
        .stat-value.cash { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .bar-wrapper { display: flex; align-items: center; gap: 10px; }
        .bar-icon { font-size: 1.2rem; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }

        #health-bar-container, #shield-bar-container {
            flex-grow: 1; height: 20px; background: rgba(0,0,0,0.8);
            border-radius: 10px; border: 2px solid #333; overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }
        #health-bar-container { border-color: #4a1515; }
        #shield-bar-container { border-color: #10364a; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #2e7d32, #76ff03); box-shadow: 0 0 15px #76ff03; transition: width 0.2s; }
        #shield-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #0277bd, #00e5ff); box-shadow: 0 0 15px #00e5ff; transition: width 0.2s; }

        #shop-toggle {
            position: absolute; top: 20px; right: 20px; pointer-events: auto;
            background: linear-gradient(135deg, #d32f2f, #9a0007);
            border: 2px solid #ff6659; color: white; font-family: inherit;
            padding: 12px 24px; font-size: 1.5rem; border-radius: 8px; cursor: pointer;
            z-index: 10; box-shadow: 0 6px 20px rgba(211,47,47,0.6), inset 0 2px 0 rgba(255,255,255,0.2);
            transition: all 0.2s; text-shadow: 1px 1px 2px black; display: flex; align-items: center; gap: 8px;
        }
        #shop-toggle:hover { transform: translateY(-3px) scale(1.05); filter: brightness(1.2); }

        #shop {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: linear-gradient(180deg, rgba(20,25,20,0.95), rgba(5,5,5,0.98));
            color: white; padding: 40px; border-radius: 16px;
            border: 2px solid #6b8c42; text-align: center;
            display: none; z-index: 100; width: 550px;
            box-shadow: 0 20px 80px rgba(0,0,0,1), 0 0 40px rgba(107,140,66,0.4);
            backdrop-filter: blur(15px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #shop.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #shop h2 { color: #ffd700; margin-top: 0; font-size: 3rem; text-shadow: 0 0 20px rgba(255,215,0,0.6); letter-spacing: 2px; border-bottom: 2px solid rgba(107,140,66,0.5); padding-bottom: 15px; }
        .shop-cash-display { font-size: 1.8rem; margin-bottom: 25px; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px; border: 1px solid #444; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }

        .upgrade-btn {
            background: linear-gradient(180deg, rgba(74,93,35,0.8), rgba(42,54,19,0.9));
            border: 2px solid #8abf56; color: white; padding: 20px 15px; border-radius: 12px;
            font-family: 'Teko', sans-serif; cursor: pointer; font-size: 1.5rem;
            transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px;
            text-shadow: 1px 1px 3px black; box-shadow: inset 0 2px 0 rgba(255,255,255,0.1), 0 5px 10px rgba(0,0,0,0.5);
        }
        .upgrade-title { font-family: 'Black Ops One', cursive; font-size: 1.2rem; }
        .upgrade-cost { color: #ffd700; font-size: 1.8rem; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .upgrade-desc { color: #bbb; font-size: 1.2rem; line-height: 1.2; }
        .upgrade-btn:hover:not(:disabled) { background: linear-gradient(180deg, rgba(107,140,66,0.9), rgba(74,93,35,1)); border-color: #aae06b; transform: translateY(-5px); box-shadow: 0 12px 25px rgba(107,140,66,0.5); }
        .upgrade-btn:disabled { background: rgba(30,30,30,0.8); border-color: #333; color: #555; cursor: not-allowed; transform: none; }
        .upgrade-btn:disabled .upgrade-cost { color: #666; text-shadow: none; }

        .close-shop { background: linear-gradient(180deg, #d32f2f, #9a0007); border: 2px solid #ff5252; width: 100%; font-family: 'Black Ops One', cursive; font-size: 1.8rem; padding: 18px; border-radius: 10px; cursor: pointer; color: white; transition: all 0.2s; text-shadow: 1px 1px 3px black; }
        .close-shop:hover { background: linear-gradient(180deg, #f44336, #d32f2f); transform: scale(1.03) translateY(-2px); }

        #boss-warning-container {
            position: fixed; top: 25%; left: 0; width: 100%;
            background: linear-gradient(90deg, rgba(200,0,0,0), rgba(200,0,0,0.6) 20%, rgba(200,0,0,0.6) 80%, rgba(200,0,0,0));
            border-top: 4px solid #ff0000; border-bottom: 4px solid #ff0000;
            padding: 25px 0; text-align: center; display: none; z-index: 40;
            backdrop-filter: blur(6px); box-shadow: 0 0 30px rgba(255,0,0,0.5);
        }
        #boss-warning { font-size: 6rem; color: #fff; text-shadow: 0 0 25px #ff0000, 5px 5px 0 #000; animation: pulse 0.6s infinite alternate; margin: 0; letter-spacing: 5px; }

        #game-over {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 1s ease; backdrop-filter: blur(10px);
        }
        #game-over.active { opacity: 1; pointer-events: auto; }
        #game-over h1 { color: #ff5252; font-size: 5rem; text-shadow: 0 0 30px rgba(255,82,82,0.8), 4px 4px 0 #000; margin-bottom: 10px; }
        #game-over p { color: #fff; font-family: 'Teko', sans-serif; font-size: 2.5rem; margin: 0; animation: fadeText 1.5s infinite alternate; }

        @keyframes pulse { 0% { transform: scale(1); text-shadow: 0 0 20px #ff0000, 4px 4px 0 #000; } 100% { transform: scale(1.05); text-shadow: 0 0 50px #ff0000, 4px 4px 0 #000; color: #ffeb3b; } }
        @keyframes fadeText { 0% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="vignette"></div>
    <div id="scanlines"></div>
    <div id="ui">
        <div id="hud-panel">
            <div class="stat-row"><span class="stat-label">KILLS</span><span class="stat-value kills" id="kills">0</span></div>
            <div class="stat-row"><span class="stat-label">FUNDS</span><span class="stat-value cash">$<span id="score">0</span></span></div>
            <div class="bar-wrapper"><span class="bar-icon">❤️</span><div id="health-bar-container"><div id="health-bar"></div></div></div>
            <div class="bar-wrapper"><span class="bar-icon">🛡️</span><div id="shield-bar-container"><div id="shield-bar"></div></div></div>
        </div>
    </div>
    <button id="shop-toggle" onclick="toggleShop()">🛒 ARMORY (B)</button>
    <div id="boss-warning-container"><h1 id="boss-warning">⚠️ BOSS DETECTED ⚠️</h1></div>
    <div id="game-over"><h1>VEHICLE DESTROYED</h1><p>Deploying replacement in <span id="respawn-timer">3</span>...</p></div>
    <div id="shop">
        <h2>FIELD ARMORY</h2>
        <div class="shop-cash-display">AVAILABLE FUNDS: <span style="color:#ffd700;font-family:'Black Ops One'">$<span id="shop-cash">0</span></span></div>
        <div class="shop-grid">
            <button class="upgrade-btn" id="btn-damage" onclick="buyUpgrade('damage')"><span class="upgrade-title">💥 HEAVY SHELLS</span><span class="upgrade-cost">$<span id="cost-damage">100</span></span><span class="upgrade-desc">Increases Damage</span></button>
            <button class="upgrade-btn" id="btn-reload" onclick="buyUpgrade('reload')"><span class="upgrade-title">⚡ AUTO-LOADER</span><span class="upgrade-cost">$<span id="cost-reload">150</span></span><span class="upgrade-desc">Faster Fire Rate</span></button>
            <button class="upgrade-btn" id="btn-health" onclick="buyUpgrade('health')"><span class="upgrade-title">🔧 REPAIR KIT</span><span class="upgrade-cost">$<span id="cost-health">50</span></span><span class="upgrade-desc">Restores 50 HP</span></button>
            <button class="upgrade-btn" id="btn-armor" onclick="buyUpgrade('armor')"><span class="upgrade-title">🛡️ IRON PLATING</span><span class="upgrade-cost">$<span id="cost-armor">200</span></span><span class="upgrade-desc">Increases Max HP</span></button>
        </div>
        <button class="close-shop" onclick="toggleShop()">DEPLOY TO BATTLEFIELD</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mapWidth = 5000, segmentWidth = 10;
        let width, height, terrain = [], bullets = [], particles = [], enemies = [], floatingTexts = [], clouds = [], mountains = [], player, gamePaused = false, screenShake = 0;
        let cash = 0, kills = 0, spawnTimer = 200, nextBossThreshold = 500;
        let camera = { x: 0, y: 0 };
        const keys = { a: false, d: false, w: false, s: false };
        let mouse = { x: 0, y: 0 };
        const gravity = 0.25;
        const upgrades = { damage: { level: 1, cost: 100 }, reload: { level: 1, cost: 150 }, armor: { level: 1, cost: 200 }, health: { cost: 50 } };

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);

        function generateEnvironment() {
            terrain = [];
            let baseHeight = 500, noiseStart = Math.random() * 1000;
            for (let x = 0; x <= mapWidth; x += segmentWidth) {
                let n = Math.sin((x+noiseStart)*0.0015)*250 + Math.sin((x+noiseStart)*0.004)*60 + Math.sin((x+noiseStart)*0.009)*15;
                terrain.push({ x, y: baseHeight + n });
            }
            clouds = [];
            for(let i=0;i<40;i++) clouds.push({ x:Math.random()*mapWidth*1.5-(mapWidth*0.25), y:Math.random()*400-100, size:Math.random()*60+30, speed:Math.random()*0.3+0.1, opacity:Math.random()*0.4+0.2 });
            mountains = [];
            for(let x=0;x<mapWidth*1.5;x+=300) mountains.push({ x:x+(Math.random()*100-50), y:350+Math.random()*100, w:400+Math.random()*200, h:300+Math.random()*200 });
        }

        function getTerrainHeight(x) {
            if (x < 0 || x > mapWidth) return height * 3;
            const index = Math.floor(x / segmentWidth);
            if (index >= 0 && index < terrain.length) return terrain[index].y;
            return 500;
        }

        function damageTerrain(x, radius) {
            const indexStart = Math.max(0, Math.floor((x-radius)/segmentWidth));
            const indexEnd = Math.min(terrain.length-1, Math.floor((x+radius)/segmentWidth));
            for (let i = indexStart; i <= indexEnd; i++) {
                let dx = terrain[i].x - x, depth = Math.sqrt(radius*radius - dx*dx);
                if (!isNaN(depth)) terrain[i].y += depth * 0.7;
            }
        }

        function addScreenShake(amount) { screenShake = Math.max(screenShake, amount); }
        function addFloatingText(x, y, text, color) { floatingTexts.push({ x, y, text, color, life: 1.0, vy: -1.5-Math.random() }); }

        class Tank {
            constructor(x, color, isPlayer, isBoss = false) {
                this.x = x; this.y = 0; this.color = color; this.isPlayer = isPlayer; this.isBoss = isBoss;
                this.scale = isBoss ? 2.5 : 1; this.angle = 0;
                this.barrelAngle = isPlayer ? -Math.PI/4 : -Math.PI*0.75;
                this.recoil = 0;
                let baseHp = isPlayer ? 100 : 40;
                if (isBoss) baseHp = 500 + (kills*15);
                this.maxHealth = baseHp; this.health = this.maxHealth;
                if (isPlayer) { this.maxShield = 50; this.shield = 50; this.shieldRegenTimer = 0; }
                this.cooldown = 0; this.maxCooldown = isPlayer ? 50 : (isBoss ? 35 : 100);
                this.speed = isBoss ? 0.6 : 1.8; this.dead = false; this.trackOffset = 0;
            }
            update() {
                if (this.dead) return;
                let targetY = getTerrainHeight(this.x);
                this.y += (targetY - this.y) * 0.5;
                let leftY = getTerrainHeight(this.x-(12*this.scale)), rightY = getTerrainHeight(this.x+(12*this.scale));
                let targetAngle = Math.atan2(rightY-leftY, 24*this.scale);
                this.angle += (targetAngle - this.angle) * 0.2;
                this.recoil += (0 - this.recoil) * 0.15;
                if (this.y > 5000) this.takeDamage(9999);
                if (this.isPlayer) {
                    let moved = false;
                    if (keys.a && this.x > 30) { this.x -= this.speed*2; moved = true; }
                    if (keys.d && this.x < mapWidth-30) { this.x += this.speed*2; moved = true; }
                    if (moved) this.trackOffset -= keys.a ? -1 : 1;
                    let worldMouseX = mouse.x + camera.x, worldMouseY = mouse.y + camera.y;
                    let dx = worldMouseX - this.x, dy = worldMouseY - (this.y-(15*this.scale));
                    let targetBarrel = Math.atan2(dy, dx);
                    let diff = targetBarrel - this.barrelAngle;
                    while (diff < -Math.PI) diff += Math.PI*2;
                    while (diff > Math.PI) diff -= Math.PI*2;
                    this.barrelAngle += diff * 0.2;
                    if (this.cooldown > 0) this.cooldown--;
                    if (this.shield < this.maxShield) { this.shieldRegenTimer++; if (this.shieldRegenTimer > 180) this.shield = Math.min(this.maxShield, this.shield+0.4); }
                    document.getElementById('health-bar').style.width = (this.health/this.maxHealth*100)+'%';
                    document.getElementById('shield-bar').style.width = (this.shield/this.maxShield*100)+'%';
                } else {
                    if (player && !player.dead) {
                        let dist = player.x - this.x;
                        if (Math.abs(dist) > (this.isBoss ? 250 : 350)) { this.x += Math.sign(dist)*this.speed; this.trackOffset -= Math.sign(dist); }
                        let dx = player.x - this.x, dy = (player.y)-(this.y-15);
                        let distToPlayer = Math.sqrt(dx*dx+dy*dy);
                        if (distToPlayer < 1200) {
                            let targetAngle2 = Math.atan2(dy-(distToPlayer*0.15), dx);
                            let diff = targetAngle2 - this.barrelAngle;
                            while (diff < -Math.PI) diff += Math.PI*2;
                            while (diff > Math.PI) diff -= Math.PI*2;
                            this.barrelAngle += diff * 0.08;
                            if (this.cooldown > 0) this.cooldown--;
                            else { shoot(this, this.isBoss ? 20 : 14, (Math.random()-0.5)*0.1); this.cooldown = this.maxCooldown+Math.random()*40; }
                        }
                    }
                }
            }
            draw() {
                if (this.dead) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.scale(this.scale, this.scale);
                ctx.fillStyle = '#151515';
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(-24,-6,48,12,4); else ctx.fillRect(-24,-6,48,12);
                ctx.fill();
                ctx.fillStyle = '#333';
                for(let i=-20;i<=20;i+=6) { let tx=i+(this.trackOffset%6); if(tx>20)tx-=42; if(tx<-20)tx+=42; ctx.fillRect(tx,-7,3,14); }
                ctx.fillStyle = '#222'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                for(let wx=-16;wx<=16;wx+=8) { ctx.beginPath(); ctx.arc(wx,0,4,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle='#555'; ctx.beginPath(); ctx.arc(wx,0,1.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#222'; }
                let hullGrad = ctx.createLinearGradient(0,-20,0,-5); hullGrad.addColorStop(0,this.color); hullGrad.addColorStop(1,'#222');
                ctx.fillStyle = hullGrad; ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(-18,-6); ctx.lineTo(18,-6); ctx.lineTo(14,-18); ctx.lineTo(-14,-18); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-10,-16,20,4);
                if (this.isPlayer && this.shield > 0) {
                    ctx.save(); let si = Math.min(1,this.shield/25);
                    ctx.strokeStyle = `rgba(0,229,255,${si*0.7})`; ctx.lineWidth = 3; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 15*si;
                    ctx.beginPath(); ctx.ellipse(0,-12,35,25,0,0,Math.PI*2); ctx.stroke();
                    ctx.fillStyle = `rgba(0,229,255,${si*0.1})`; ctx.fill(); ctx.restore();
                }
                if (!this.isPlayer) {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(-20,-35,40,5);
                    let hpP = Math.max(0,this.health/this.maxHealth); ctx.fillStyle = hpP>0.5?'#76ff03':'#ff5252'; ctx.fillRect(-20,-35,40*hpP,5);
                    if (this.isBoss) { ctx.fillStyle='#ffd700'; ctx.font='bold 18px Arial'; ctx.fillText('☠️ BOSS',-25,-42); }
                }
                ctx.restore();
                ctx.save(); ctx.translate(this.x, this.y-(16*this.scale));
                ctx.save(); ctx.rotate(this.barrelAngle);
                let ro = -this.recoil;
                let bGrad = ctx.createLinearGradient(0,-3*this.scale,0,3*this.scale); bGrad.addColorStop(0,'#555'); bGrad.addColorStop(0.5,'#222'); bGrad.addColorStop(1,'#111');
                ctx.fillStyle = bGrad; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(ro,-2.5*this.scale,28*this.scale,5*this.scale); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#111'; ctx.fillRect(ro+24*this.scale,-3.5*this.scale,6*this.scale,7*this.scale);
                ctx.restore();
                ctx.rotate(this.angle);
                let dGrad = ctx.createRadialGradient(0,-2,2,0,0,12*this.scale); dGrad.addColorStop(0,this.color); dGrad.addColorStop(1,'#111');
                ctx.fillStyle = dGrad; ctx.beginPath(); ctx.arc(0,0,12*this.scale,0,Math.PI,true); ctx.fill(); ctx.stroke();
                ctx.restore();
            }
            takeDamage(amt) {
                let actualDamage = amt;
                if (this.isPlayer && this.shield > 0) {
                    this.shieldRegenTimer = 0;
                    if (this.shield >= amt) { this.shield -= amt; actualDamage = 0; createParticles(this.x,this.y-15,5,'spark','#00e5ff'); }
                    else { actualDamage = amt - this.shield; this.shield = 0; addScreenShake(5); createParticles(this.x,this.y-15,15,'spark','#00e5ff'); }
                }
                if (actualDamage > 0) {
                    this.health -= actualDamage;
                    let isCrit = Math.random() > 0.8, dmgColor = this.isPlayer ? '#ff5252' : (isCrit ? '#ffeb3b' : '#fff');
                    let dmgAmt = Math.round(actualDamage * (isCrit ? 1.5 : 1));
                    if(isCrit && !this.isPlayer) this.health -= (dmgAmt - actualDamage);
                    addFloatingText(this.x+(Math.random()*20-10), this.y-30*this.scale, dmgAmt, dmgColor);
                    createParticles(this.x, this.y, 5, 'debris');
                }
                if (this.health <= 0 && !this.dead) this.die();
            }
            die() {
                this.dead = true; addScreenShake(this.isBoss ? 25 : 10);
                createParticles(this.x,this.y,this.isBoss?100:40,'fire'); createParticles(this.x,this.y,this.isBoss?50:20,'smoke'); createParticles(this.x,this.y,20,'debris');
                damageTerrain(this.x, this.isBoss ? 80 : 40);
                if (!this.isPlayer) {
                    let reward = this.isBoss ? 800 : Math.floor(50+Math.random()*20);
                    cash += reward; kills++;
                    addFloatingText(this.x, this.y-50, "+$"+reward, '#ffd700');
                    updateUI();
                } else {
                    document.getElementById('hud-panel').style.transform = 'translateY(-150%)';
                    showGameOver();
                }
            }
        }

        class Bullet {
            constructor(x, y, angle, power, owner) {
                this.x = x; this.y = y; this.vx = Math.cos(angle)*power; this.vy = Math.sin(angle)*power;
                this.owner = owner; this.radius = owner.isBoss ? 7 : 4; this.active = true; this.history = [];
                let baseDmg = owner.isPlayer ? 25 : (owner.isBoss ? 40 : 12);
                this.damage = owner.isPlayer ? (baseDmg*(1+(upgrades.damage.level-1)*0.3)) : baseDmg;
            }
            update() {
                this.history.push({x:this.x,y:this.y}); if(this.history.length>5)this.history.shift();
                this.x+=this.vx; this.y+=this.vy; this.vy+=gravity*0.8;
                if(this.x<-1000||this.x>mapWidth+1000){this.active=false;return;}
                if(this.y>=getTerrainHeight(this.x)){this.explode();return;}
                let targets = this.owner.isPlayer ? enemies : [player];
                for(let t of targets) {
                    if(!t.dead){let dx=this.x-t.x,dy=this.y-(t.y-12*t.scale);if(Math.sqrt(dx*dx+dy*dy)<22*t.scale){t.takeDamage(this.damage);this.explode(true);return;}}
                }
            }
            explode(hitTank=false) {
                this.active = false; let isBig = this.owner.isBoss;
                if(!hitTank){damageTerrain(this.x,isBig?60:30);createParticles(this.x,this.y,10,'dirt');}
                createParticles(this.x,this.y,isBig?30:15,'fire'); createParticles(this.x,this.y,isBig?15:5,'smoke');
                addScreenShake(isBig?8:(this.owner.isPlayer?4:2));
                let splashRadius = isBig?80:45;
                [player,...enemies].forEach(t=>{if(!t.dead){let d=Math.sqrt((this.x-t.x)**2+(this.y-t.y)**2);if(d<splashRadius)t.takeDamage(this.damage*0.6*(1-d/splashRadius));}});
            }
            draw() {
                if(this.history.length>1){ctx.beginPath();ctx.moveTo(this.history[0].x,this.history[0].y);for(let i=1;i<this.history.length;i++)ctx.lineTo(this.history[i].x,this.history[i].y);ctx.strokeStyle=this.owner.isPlayer?'rgba(255,200,100,0.4)':'rgba(255,50,50,0.4)';ctx.lineWidth=this.radius;ctx.lineCap='round';ctx.stroke();}
                ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
                ctx.fillStyle = this.owner.isPlayer?'#fff':'#ffcfcf'; ctx.shadowColor = this.owner.isPlayer?'#ff9800':'#ff1744'; ctx.shadowBlur=10; ctx.fill(); ctx.shadowBlur=0;
            }
        }

        class Particle {
            constructor(x, y, type, colorOverride=null) {
                this.x=x;this.y=y;this.type=type;this.life=1.0;this.active=true;
                if(type==='fire'){let s=Math.random()*6+2,a=Math.random()*Math.PI*2;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.size=Math.random()*15+5;this.color=Math.random()>0.5?'#ff9800':'#ff3d00';this.decay=Math.random()*0.04+0.02;}
                else if(type==='smoke'){let s=Math.random()*3,a=Math.random()*Math.PI*2;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s-1;this.size=Math.random()*20+10;this.color='#333';this.decay=Math.random()*0.015+0.005;}
                else if(type==='spark'){let s=Math.random()*8+4,a=Math.random()*Math.PI*2;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.size=Math.random()*3+1;this.color=colorOverride||'#fff';this.decay=Math.random()*0.05+0.03;}
                else if(type==='dirt'||type==='debris'){let s=Math.random()*6+2,a=-Math.random()*Math.PI;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.size=Math.random()*6+2;this.color=type==='dirt'?'#5d4037':'#222';this.decay=Math.random()*0.02+0.01;this.gravity=0.3;}
            }
            update() {
                this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;
                if(this.type==='smoke')this.size+=0.5;
                else if(this.type==='fire')this.size*=0.92;
                else if(this.gravity){this.vy+=this.gravity;let gy=getTerrainHeight(this.x);if(this.y>=gy){this.y=gy;this.vx*=0.5;this.vy*=-0.3;}}
                if(this.life<=0||this.size<=0.5)this.active=false;
            }
            draw() {
                ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.color;
                if(this.type==='fire'||this.type==='spark')ctx.globalCompositeOperation='lighter';
                ctx.beginPath();
                if(this.type==='debris')ctx.rect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);
                else ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
                ctx.fill();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
            }
        }

        function shoot(tank,power,spread=0){
            let angle=tank.barrelAngle+spread,bx=tank.x+Math.cos(angle)*(30*tank.scale),by=(tank.y-15*tank.scale)+Math.sin(angle)*(30*tank.scale);
            bullets.push(new Bullet(bx,by,angle,power,tank));tank.recoil=12*tank.scale;
            if(tank.isPlayer){addScreenShake(3);createParticles(bx,by,8,'fire');createParticles(bx,by,5,'smoke');}
        }
        function createParticles(x,y,count,type,color=null){for(let i=0;i<count;i++)particles.push(new Particle(x,y,type,color));}

        function init() {
            width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight;
            generateEnvironment();
            player = new Tank(400,'#5a7d32',true);
            window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='b'&&!player.dead)toggleShop();});
            window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
            window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
            window.addEventListener('mousedown',()=>{if(!gamePaused&&!player.dead&&player.cooldown<=0){shoot(player,22);player.cooldown=player.maxCooldown;}});
            requestAnimationFrame(loop);
        }

        function toggleShop(){
            if(player.dead)return;gamePaused=!gamePaused;
            const shopEl=document.getElementById('shop');
            if(gamePaused)shopEl.classList.add('active');else shopEl.classList.remove('active');
            updateUI();
        }

        function buyUpgrade(type){
            let up=upgrades[type],cost=(type==='health')?50:up.cost;
            if(cash>=cost){
                if(type==='health'&&player.health>=player.maxHealth)return;
                cash-=cost;
                if(type==='health'){player.health=Math.min(player.health+50,player.maxHealth);createParticles(player.x,player.y,20,'spark','#76ff03');}
                else{up.level++;up.cost=Math.floor(up.cost*1.5);if(type==='reload')player.maxCooldown=Math.max(15,player.maxCooldown-8);if(type==='armor'){player.maxHealth+=50;player.health+=50;}createParticles(player.x,player.y,30,'spark','#ffd700');}
                updateUI();
            }
        }

        function updateUI(){
            document.getElementById('score').innerText=cash;document.getElementById('shop-cash').innerText=cash;document.getElementById('kills').innerText=kills;
            document.getElementById('cost-damage').innerText=upgrades.damage.cost;document.getElementById('cost-reload').innerText=upgrades.reload.cost;document.getElementById('cost-armor').innerText=upgrades.armor.cost;
            ['damage','reload','armor','health'].forEach(id=>{let cost=(id==='health')?50:upgrades[id].cost;document.getElementById('btn-'+id).disabled=cash<cost||(id==='health'&&player.health>=player.maxHealth);});
        }

        function spawnManager(){
            spawnTimer--;
            if(spawnTimer<=0){
                let spawnX=Math.random()>0.5?Math.min(mapWidth-50,player.x+width*0.8):Math.max(50,player.x-width*0.8);
                spawnX=Math.max(50,Math.min(mapWidth-50,spawnX));
                enemies.push(new Tank(spawnX,'#b71c1c',false));
                spawnTimer=Math.max(80,300-(kills*5));
            }
            if(cash>nextBossThreshold){
                nextBossThreshold+=1500+(kills*50);
                let bossX=(player.x<mapWidth/2)?player.x+width:player.x-width;
                bossX=Math.max(100,Math.min(mapWidth-100,bossX));
                enemies.push(new Tank(bossX,'#263238',false,true));
                const w=document.getElementById('boss-warning-container');w.style.display='block';addScreenShake(15);setTimeout(()=>w.style.display='none',4000);
            }
        }

        function showGameOver(){
            const go=document.getElementById('game-over');go.classList.add('active');let timer=4;
            let intv=setInterval(()=>{timer--;document.getElementById('respawn-timer').innerText=timer;if(timer<=0){clearInterval(intv);location.reload();}},1000);
        }

        function loop(){
            if(!gamePaused){
                let skyGrad=ctx.createLinearGradient(0,0,0,height);skyGrad.addColorStop(0,"#4a90e2");skyGrad.addColorStop(1,"#d1e8ff");ctx.fillStyle=skyGrad;ctx.fillRect(0,0,width,height);
                let targetCamX=player.x-width/2;targetCamX=Math.max(0,Math.min(targetCamX,mapWidth-width));camera.x+=(targetCamX-camera.x)*0.08;
                let lookAheadY=(mouse.y-height/2)*0.3,targetCamY=player.y-height*0.6+lookAheadY;camera.y+=(targetCamY-camera.y)*0.08;
                if(!player.dead)spawnManager();
                ctx.save();
                if(screenShake>0){ctx.translate((Math.random()-0.5)*screenShake,(Math.random()-0.5)*screenShake);screenShake*=0.85;if(screenShake<0.5)screenShake=0;}
                ctx.fillStyle='rgba(255,255,255,0.8)';
                clouds.forEach(c=>{c.x+=c.speed;if(c.x>mapWidth*1.5)c.x=-mapWidth*0.25;let dx=c.x-(camera.x*0.15);ctx.globalAlpha=c.opacity;ctx.beginPath();ctx.arc(dx,c.y-camera.y*0.1,c.size,0,Math.PI*2);ctx.arc(dx+c.size*0.8,c.y-camera.y*0.1+c.size*0.2,c.size*0.7,0,Math.PI*2);ctx.arc(dx-c.size*0.8,c.y-camera.y*0.1+c.size*0.2,c.size*0.7,0,Math.PI*2);ctx.fill();});
                ctx.globalAlpha=1;
                ctx.fillStyle='#7a9e7e';mountains.forEach(m=>{let dx=m.x-(camera.x*0.3),dy=m.y-(camera.y*0.3);ctx.beginPath();ctx.moveTo(dx,height+1000);ctx.lineTo(dx+m.w/2,dy);ctx.lineTo(dx+m.w,height+1000);ctx.fill();});
                ctx.translate(-camera.x,-camera.y);
                ctx.beginPath();ctx.moveTo(0,height+5000);for(let i=0;i<terrain.length;i++)ctx.lineTo(terrain[i].x,terrain[i].y);ctx.lineTo(mapWidth,height+5000);ctx.lineTo(0,height+5000);
                let earthGrad=ctx.createLinearGradient(0,500,0,1500);earthGrad.addColorStop(0,'#5d4037');earthGrad.addColorStop(1,'#3e2723');ctx.fillStyle=earthGrad;ctx.fill();
                ctx.lineWidth=14;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#4CAF50';ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle='#81C784';ctx.stroke();
                if(!player.dead){player.update();player.draw();}
                enemies.forEach((e,index)=>{e.update();e.draw();if(e.dead&&Math.random()>0.995)enemies.splice(index,1);});
                for(let i=bullets.length-1;i>=0;i--){bullets[i].update();bullets[i].draw();if(!bullets[i].active)bullets.splice(i,1);}
                for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw();if(!particles[i].active)particles.splice(i,1);}
                ctx.font='bold 24px Teko';ctx.textAlign='center';
                for(let i=floatingTexts.length-1;i>=0;i--){let ft=floatingTexts[i];ft.y+=ft.vy;ft.life-=0.02;ctx.globalAlpha=Math.max(0,ft.life);ctx.fillStyle=ft.color;ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(ft.text,ft.x,ft.y);ctx.fillText(ft.text,ft.x,ft.y);if(ft.life<=0)floatingTexts.splice(i,1);}
                ctx.globalAlpha=1;ctx.textAlign='left';
                ctx.restore();
            }
            requestAnimationFrame(loop);
        }
        init();
    </script>
</body>
</html>
