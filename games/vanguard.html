<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Vanguard: Arsenal Expansion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000810; 
            font-family: 'Orbitron', sans-serif; 
            /* Hide the default cursor for our custom glowing reticle */
            cursor: none; 
        }
        
        canvas { display: block; }
        
        #ui { 
            position: absolute; 
            inset: 0; 
            pointer-events: none; 
            color: #00f2ff; 
            text-shadow: 0 0 5px rgba(0,242,255,0.5); 
        }
        
        .glass { 
            background: rgba(0, 20, 40, 0.8); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(0, 242, 255, 0.2); 
            border-radius: 4px; 
        }
        
        .bar-container { 
            height: 6px; 
            background: rgba(0,0,0,0.4); 
            border-radius: 3px; 
            overflow: hidden; 
        }
        
        .bar-fill { 
            height: 100%; 
            transition: width 0.3s ease-out; 
        }
        
        .weapon-slot { 
            transition: all 0.2s ease; 
            border: 1px solid rgba(0, 242, 255, 0.1); 
            white-space: nowrap; 
            font-size: 8px; /* Smaller font */
            padding: 2px 4px; /* Reduced padding */
            cursor: none;
            pointer-events: auto; 
        }
        
        .weapon-active { 
            background: rgba(0, 242, 255, 0.3); 
            border-color: #00f2ff; 
            box-shadow: 0 0 10px rgba(0,242,255,0.4); 
            transform: translateY(-2px); 
            color: #fff; 
        }

        .boss-btn {
            pointer-events: auto;
            cursor: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px; /* Tighter letter spacing */
            font-weight: bold;
            font-size: 9px; /* Smaller font */
            padding: 4px 6px; /* Reduced padding */
            text-shadow: none;
        }

        .boss-btn:hover {
            transform: translateX(-5px);
            box-shadow: 0 0 15px currentColor;
        }
        
        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 8, 16, 0.9);
            backdrop-filter: blur(5px);
            z-index: 50; /* Ensure it's above the UI */
            pointer-events: auto; /* Allow clicking the button */
        }
        
        .deploy-btn {
            background: rgba(0, 242, 255, 0.1);
            border: 2px solid #00f2ff;
            color: #00f2ff;
            padding: 10px 40px;
            font-size: 18px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }
        
        .deploy-btn:hover {
            background: rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.6);
            transform: scale(1.05);
            color: white;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="start-screen">
    <div class="glass p-8 text-center border-t-4 border-cyan-500 rounded-lg flex flex-col items-center gap-6">
        <div>
            <h1 class="text-3xl font-black tracking-widest text-white mb-2">NEON VANGUARD</h1>
            <p class="text-xs text-cyan-300 opacity-80 tracking-widest uppercase">Arsenal Expansion Protocol</p>
        </div>
        <div class="text-[10px] text-left text-gray-400 max-w-xs space-y-2">
            <p><span class="text-white">WASD / ARROWS</span> - Move & Rotate</p>
            <p><span class="text-white">SPACE / CLICK</span> - Fire Primary</p>
            <p><span class="text-white">1-9</span> - Switch Weapon Systems</p>
        </div>
        <button id="deploy-button" class="deploy-btn mt-4">Deploy</button>
    </div>
</div>

<div id="ui" style="display: none;"> <!-- Initially hide UI -->
    <!-- Player Status & Arsenal -->
    <div class="absolute top-4 left-4 flex flex-col gap-2"> <!-- Reduced gap and top/left spacing -->
        <div class="glass p-3 min-w-[200px]"> <!-- Reduced padding and min-width -->
            <div class="flex justify-between items-center mb-1">
                <span class="text-[9px] opacity-70 tracking-widest text-cyan-300">COMMANDER</span> <!-- Smaller text -->
                <span id="lvl-display" class="text-[10px] font-bold text-yellow-400">LVL 1</span>
            </div>
            <div class="text-lg font-bold tracking-widest text-white">VANGUARD-01</div> <!-- Slightly smaller name -->
            <div class="mt-1">
                <div class="bar-container"><div id="exp-bar" class="bar-fill bg-yellow-400" style="width: 0%"></div></div>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-1 w-56"> <!-- Tighter grid, smaller width -->
            <div id="slot-1" class="glass weapon-slot weapon-active" onclick="switchWeapon(1)">1: PLASMA</div>
            <div id="slot-2" class="glass weapon-slot" onclick="switchWeapon(2)">2: SEEKERS</div>
            <div id="slot-3" class="glass weapon-slot" onclick="switchWeapon(3)">3: TITAN</div>
            <div id="slot-4" class="glass weapon-slot" onclick="switchWeapon(4)">4: DRONES</div>
            <div id="slot-5" class="glass weapon-slot border-yellow-500/50 text-yellow-300" onclick="switchWeapon(5)">5: JUDGE</div>
            <div id="slot-6" class="glass weapon-slot" onclick="switchWeapon(6)">6: CHRONO</div>
            <div id="slot-7" class="glass weapon-slot" onclick="switchWeapon(7)">7: SWARM</div>
            <div id="slot-8" class="glass weapon-slot" onclick="switchWeapon(8)">8: VOLT</div>
            <div id="slot-9" class="glass weapon-slot" onclick="switchWeapon(9)">9: NOVA</div>
        </div>
    </div>

    <!-- Boss Summoning Panel -->
    <div class="absolute top-4 right-4 flex flex-col gap-2 w-48 text-right"> <!-- Reduced spacing and width -->
        <div class="glass p-2 border-r-2 border-red-500"> <!-- Reduced padding and border -->
            <div class="text-[9px] opacity-70 tracking-widest text-red-400 mb-1">PROTOCOLS</div>
            <button class="boss-btn w-full text-right glass text-orange-400 border-orange-500/30 hover:bg-orange-500/20 mb-1" onclick="summonBoss(1)">
                Aegis Cruiser
            </button>
            <button class="boss-btn w-full text-right glass text-purple-400 border-purple-500/30 hover:bg-purple-500/20 mb-1" onclick="summonBoss(2)">
                Void Ray
            </button>
            <button class="boss-btn w-full text-right glass text-red-500 border-red-500/30 hover:bg-red-500/20" onclick="summonBoss(3)">
                Nexus Dread
            </button>
        </div>
    </div>

    <!-- Bottom HUD -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-6 w-full max-w-3xl px-6"> <!-- Reduced spacing -->
        <div class="flex-1 text-right">
            <div class="text-[9px] mb-1">SHIELD</div>
            <div class="bar-container"><div id="hull-bar" class="bar-fill bg-cyan-400" style="width: 100%"></div></div>
        </div>
        <div class="glass p-2 px-6 text-center border-t-2 border-cyan-500">
            <div id="score-val" class="text-xl font-bold text-white">000000</div>
            <div class="text-[7px] opacity-50 uppercase tracking-widest">Score</div>
        </div>
        <div class="flex-1 text-left">
            <div class="text-[9px] mb-1">REACTOR</div>
            <div class="bar-container"><div id="energy-bar" class="bar-fill bg-orange-500" style="width: 100%"></div></div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GAME = { score:0, level:1, exp:0, expToNext:100, lastTime:0, shake:0, activeWeapon:1, isRunning: false };
const player = { x:0, y:0, angle:0, velX:0, velY:0, hull:100, energy:100, lastFire:0, radius:15 };
let mouseX = 0, mouseY = 0;

let stars = [], projectiles = [], enemies = [], bosses = [], particles = [], teammates = [], singularities = [], keys = {};

function init(){
    resize(); 
    // Start player in the center for the background animation, 
    // but they will be reset on deploy anyway
    player.x = canvas.width/2; 
    player.y = canvas.height/2;
    mouseX = player.x;
    mouseY = player.y;

    for(let i=0; i<250; i++) {
        stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, size:Math.random()*2, speed:0.1+Math.random()*0.7});
    }
    
    // Draw initial state so background isn't blank
    draw();
    
    // Set up Deploy Button
    document.getElementById('deploy-button').addEventListener('click', startGame);
}

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
    
    // Reset Player to center
    player.x = canvas.width/2; 
    player.y = canvas.height/2;
    player.velX = 0;
    player.velY = 0;
    player.angle = 0;
    player.hull = 100;
    player.energy = 100;
    
    // Clear any existing entities (in case of restart logic later)
    enemies = [];
    projectiles = [];
    bosses = [];
    teammates = [];
    singularities = [];
    
    // Spawn initial enemies
    for(let i=0; i<8; i++) spawnEnemy();
    
    GAME.isRunning = true;
    GAME.lastTime = performance.now();
    requestAnimationFrame(update);
}

function resize(){ 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight; 
    // Re-distribute stars across the new width if the screen is resized
    if (stars && stars.length > 0) {
        stars.forEach(s => {
            s.x = Math.random() * canvas.width;
            s.y = Math.random() * canvas.height;
        });
    }
}

function spawnEnemy(x, y, type = 'basic'){
    const pad = 100;
    if (x === undefined || y === undefined) {
        const edge = Math.floor(Math.random()*4);
        if(edge===0){ x = Math.random()*canvas.width; y = -pad; }
        else if(edge===1){ x = canvas.width+pad; y = Math.random()*canvas.height; }
        else if(edge===2){ x = Math.random()*canvas.width; y = canvas.height+pad; }
        else{ x = -pad; y = Math.random()*canvas.height; }
    }
    
    let hp = 50 + (GAME.level * 20);
    let speed = 1.0 + Math.random()*1.5;
    let radius = 22;
    let color = '#ff0044';

    if (type === 'bomber') {
        hp *= 0.5;
        speed *= 1.8;
        color = '#ffaa00';
        radius = 16;
    } else if (type === 'heavy') {
        hp *= 4;
        speed *= 0.5;
        color = '#aa0000';
        radius = 35;
    }

    enemies.push({x, y, hp, maxHp:hp, speed, baseSpeed:speed, slowTimer:0, angle:0, radius, color, type});
}

function createExplosion(x, y, color, count=15, sizeMult=1){
    for(let i=0; i<count; i++){
        const ang = Math.random()*Math.PI*2;
        const spd = Math.random()*8*sizeMult;
        particles.push({x, y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:1.0, size:(Math.random()*4)*sizeMult, color:color||'#00f2ff'});
    }
}

function summonBoss(type) {
    let b = { 
        type, 
        x: canvas.width / 2, 
        y: -150, 
        hp: 0, 
        maxHp: 0, 
        timer: 0, 
        minionsTimer: 0, 
        angle: Math.PI/2,
        slowTimer: 0
    };

    if (type === 1) { // Easiest: Aegis Cruiser
        b.name = "AEGIS CRUISER"; 
        b.maxHp = 6000; 
        b.hp = 6000; 
        b.radius = 50; 
        b.color = '#ff8800';
        b.score = 5000;
    } else if (type === 2) { // Medium: Void Ray
        b.name = "VOID RAY"; 
        b.maxHp = 15000; 
        b.hp = 15000; 
        b.radius = 45; 
        b.color = '#cc00ff';
        b.score = 12000;
        b.dashState = 0; // 0 = idle, 1 = dashing
    } else if (type === 3) { // Hardest: Nexus Dreadnought
        b.name = "NEXUS DREADNOUGHT"; 
        b.maxHp = 45000; 
        b.hp = 45000; 
        b.radius = 90; 
        b.color = '#ff0000';
        b.score = 30000;
        b.phase = 1;
    }
    
    // Announce appearance
    GAME.shake = 20;
    createExplosion(b.x, b.y, b.color, 100, 5);
    bosses.push(b);
}

function update(time){
    if (!GAME.isRunning) return;

    const dt = Math.min((time-GAME.lastTime)/1000, 0.1); 
    GAME.lastTime = time;

    for(let i=1; i<=9; i++){ if(keys['Digit'+i]) switchWeapon(i); }
    
    const rs = 5.5*dt;
    if(keys['ArrowLeft'] || keys['KeyA']) player.angle -= rs;
    if(keys['ArrowRight'] || keys['KeyD']) player.angle += rs;
    
    const thrust = 20*dt;
    if(keys['ArrowUp'] || keys['KeyW']){
        player.velX += Math.cos(player.angle)*thrust; 
        player.velY += Math.sin(player.angle)*thrust;
        if(Math.random()>0.3) {
            particles.push({x:player.x-Math.cos(player.angle)*12, y:player.y-Math.sin(player.angle)*12, vx:-Math.cos(player.angle)*4+(Math.random()-0.5), vy:-Math.sin(player.angle)*4+(Math.random()-0.5), life:0.6, size:4, color:'#00ccff'});
        }
    }
    
    player.x += player.velX; 
    player.y += player.velY; 
    player.velX *= 0.985; 
    player.velY *= 0.985;
    
    // Screen wrapping for player
    if(player.x < -40) player.x = canvas.width+40; 
    if(player.x > canvas.width+40) player.x = -40;
    if(player.y < -40) player.y = canvas.height+40; 
    if(player.y > canvas.height+40) player.y = -40;
    
    if((keys['MouseDown0'] || keys['KeyF'] || keys['Space']) && time-player.lastFire > getFireRate()){
        fireWeapon();
        player.lastFire = time;
    }
    
    updateTeammates(dt, time); 
    updateProjectiles(dt); 
    updateEnemies(dt); 
    updateBosses(dt);
    updateParticles(dt); 
    updateSingularities(dt);
    
    player.energy = Math.min(100, player.energy+20*dt);
    if(GAME.shake > 0) GAME.shake *= 0.88;
    
    draw(); 
    requestAnimationFrame(update);
}

function switchWeapon(id){
    GAME.activeWeapon = id;
    document.querySelectorAll('.weapon-slot').forEach(el=>el.classList.remove('weapon-active'));
    document.getElementById(`slot-${id}`).classList.add('weapon-active');
}

function getFireRate(){
    const r = [0, 60, 350, 400, 2000, 3000, 150, 100, 400, 2500];
    return r[GAME.activeWeapon] || 100;
}

function spawnDrone(x, y, angle, gen=0, isSwarmer=false){
    if(gen>4) return;
    const scale = isSwarmer ? 0.3 : Math.max(0.3, 1.0-(gen*0.2));
    teammates.push({
        x, y, angle, 
        hp: isSwarmer ? 15 : (80/(gen+1)), 
        lastFire: 0, 
        lerpFactor: isSwarmer ? 0.08 : (0.01+(gen*0.02)), 
        burstTimer: 0.8, burstDir: angle, burstSpeed: isSwarmer ? 18 : 14, 
        generation: gen, scale, radius: 18*scale, isSwarmer, life: isSwarmer ? 8 : Infinity
    });
}

function fireWeapon(){
    const cos = Math.cos(player.angle), sin = Math.sin(player.angle);
    if(GAME.activeWeapon===1){
        projectiles.push({x:player.x+cos*20, y:player.y+sin*20, vx:cos*18, vy:sin*18, life:1.2, size:10, type:'plasma', color:'#00f2ff', isEnemy: false});
        GAME.shake=1.5;
    }
    else if(GAME.activeWeapon===2){
        if(player.energy<15) return; player.energy-=15;
        for(let i=0; i<12; i++){
            const la = (Math.PI*2/12)*i;
            projectiles.push({x:player.x, y:player.y, vx:Math.cos(la)*12, vy:Math.sin(la)*12, life:10, size:7, type:'missile', state:'deploying', timer:0.6, angle:la, color:'#ff3300', isEnemy: false});
        }
        GAME.shake=4;
    }
    else if(GAME.activeWeapon===3){
        if(player.energy<20) return; player.energy-=20; GAME.shake=15;
        createExplosion(player.x, player.y, '#00f2ff', 80, 5);
        enemies.forEach(e=>{ if(Math.hypot(e.x-player.x, e.y-player.y)<450) e.hp-=200; });
        bosses.forEach(b=>{ if(Math.hypot(b.x-player.x, b.y-player.y)<450) b.hp-=300; });
    }
    else if(GAME.activeWeapon===4){
        if(player.energy<60) return; player.energy-=60;
        for(let i=0; i<7; i++) spawnDrone(player.x, player.y, (Math.PI*2/7)*i, 0);
        GAME.shake=10;
    }
    else if(GAME.activeWeapon===5){
        if(player.energy<100) return; player.energy-=100;
        singularities.push({x:player.x+cos*100, y:player.y+sin*100, vx:cos*4, vy:sin*4, life:6, radius:0, maxRadius:350, isEnemy: false});
        GAME.shake=25;
    }
    else if(GAME.activeWeapon===6){
        projectiles.push({x:player.x+cos*20, y:player.y+sin*20, vx:cos*22, vy:sin*22, life:1.5, size:6, type:'chrono', color:'#cc00ff', isEnemy: false});
    }
    else if(GAME.activeWeapon===7){
        if(player.energy<10) return; player.energy-=10;
        spawnDrone(player.x, player.y, player.angle+(Math.random()-0.5), 0, true);
    }
    else if(GAME.activeWeapon===8){
        if(player.energy<15) return; player.energy-=15;
        spawnChainLightning(player.x, player.y);
    }
    else if(GAME.activeWeapon===9){
        if(player.energy<80) return; player.energy-=80;
        projectiles.push({x:player.x, y:player.y, vx:cos*35, vy:sin*35, life:1.5, size:45, type:'nova', color:'#fff', isEnemy: false});
        GAME.shake=15;
    }
}

function spawnChainLightning(sx, sy){
    let cx = sx, cy = sy, hit = [];
    let possibleTargets = [...enemies, ...bosses];
    for(let i=0; i<6; i++){
        let near = null, md = 400;
        possibleTargets.forEach(e => {
            if(hit.includes(e)) return;
            let d = Math.hypot(e.x-cx, e.y-cy);
            if(d < md){ md = d; near = e; }
        });
        if(near){
            particles.push({type:'bolt', x1:cx, y1:cy, x2:near.x, y2:near.y, life:0.3});
            near.hp -= 120; 
            hit.push(near); 
            cx = near.x; 
            cy = near.y;
        } else break;
    }
}

function updateSingularities(dt){
    for(let i=singularities.length-1; i>=0; i--){
        const s = singularities[i];
        s.life -= dt;
        s.x += s.vx; s.y += s.vy; 
        s.vx *= 0.96; s.vy *= 0.96;
        s.radius = Math.min(s.maxRadius, s.radius+150*dt);
        
        if (s.isEnemy) {
            // Pull player
            let pd = Math.hypot(player.x-s.x, player.y-s.y);
            if(pd < s.radius) {
                let pa = Math.atan2(s.y-player.y, s.x-player.x);
                player.x += Math.cos(pa)*6; player.y += Math.sin(pa)*6;
                player.hull -= 10*dt;
            }
            // Pull teammates (drones)
            teammates.forEach(t => {
                if(Math.hypot(t.x-s.x, t.y-s.y) < s.radius) {
                    let pa = Math.atan2(s.y-t.y, s.x-t.x);
                    t.x += Math.cos(pa)*8; t.y += Math.sin(pa)*8;
                    t.hp -= 30*dt;
                }
            });
        } else {
            // Pull enemies
            enemies.forEach(e => {
                const d = Math.hypot(e.x-s.x, e.y-s.y);
                if(d < s.radius){
                    const pa = Math.atan2(s.y-e.y, s.x-e.x);
                    e.x += Math.cos(pa)*8; e.y += Math.sin(pa)*8;
                    e.hp -= 80*dt;
                }
            });
            // Damage bosses (too heavy to pull)
            bosses.forEach(b => {
                if(Math.hypot(b.x-s.x, b.y-s.y) < s.radius) b.hp -= 80*dt;
            });
        }
        
        if(s.life <= 0){
            createExplosion(s.x, s.y, s.isEnemy ? '#ff0000' : '#6600ff', 100, 6);
            if(s.isEnemy) {
                if(Math.hypot(player.x-s.x, player.y-s.y) < s.radius) player.hull -= 40;
                teammates.forEach(t => { if(Math.hypot(t.x-s.x, t.y-s.y) < s.radius) t.hp -= 150; });
            } else {
                enemies.forEach(e => { if(Math.hypot(e.x-s.x, e.y-s.y) < s.radius) e.hp -= 500; });
                bosses.forEach(b => { if(Math.hypot(b.x-s.x, b.y-s.y) < s.radius) b.hp -= 1000; });
            }
            singularities.splice(i, 1);
        }
    }
}

function updateTeammates(dt, time){
    for(let i=teammates.length-1; i>=0; i--){
        const t = teammates[i];
        if(t.isSwarmer) t.life -= dt;
        
        // Find closest enemy OR boss
        let target = null, md = 800;
        enemies.forEach(e => {
            const d = Math.hypot(e.x-t.x, e.y-t.y);
            if(d < md){ md = d; target = e; }
        });
        bosses.forEach(b => {
            const d = Math.hypot(b.x-t.x, b.y-t.y);
            if(d < md){ md = d; target = b; }
        });

        // Boid separation (prevent drones overlapping)
        teammates.forEach(other => {
            if(t===other) return;
            const dx = t.x-other.x, dy = t.y-other.y;
            const dist = Math.hypot(dx, dy);
            const minD = (t.radius+other.radius)*2;
            if(dist < minD && dist > 0){
                t.x += (dx/dist)*4; t.y += (dy/dist)*4;
            }
        });
        
        if(t.burstTimer > 0){
            t.x += Math.cos(t.burstDir)*t.burstSpeed*t.burstTimer;
            t.y += Math.sin(t.burstDir)*t.burstSpeed*t.burstTimer;
            t.burstTimer -= dt*2;
        } else {
            const dx = target ? target.x : player.x;
            const dy = target ? target.y : player.y;
            const dist = Math.hypot(dx-t.x, dy-t.y);
            if(dist > (t.isSwarmer ? 20 : 120)){
                t.x += (dx-t.x)*t.lerpFactor; 
                t.y += (dy-t.y)*t.lerpFactor;
            }
        }
        
        if(target){
            const ta = Math.atan2(target.y-t.y, target.x-t.x);
            t.angle += (ta-t.angle)*0.15;
            if(time-t.lastFire > (t.isSwarmer ? 200 : 500)){
                projectiles.push({
                    x: t.x, y: t.y, 
                    vx: Math.cos(t.angle)*15, vy: Math.sin(t.angle)*15, 
                    life: 1, size: 5*t.scale, type: 'plasma', 
                    color: t.isSwarmer ? '#ffcc00' : '#00ff88', isEnemy: false
                });
                t.lastFire = time;
            }
        }
        
        // Damage from colliding with enemies
        enemies.forEach(e => {
            if(Math.hypot(e.x-t.x, e.y-t.y) < e.radius+t.radius) t.hp -= 50*dt;
        });
        bosses.forEach(b => {
            if(Math.hypot(b.x-t.x, b.y-t.y) < b.radius+t.radius) t.hp -= 150*dt;
        });
        
        if(t.hp <= 0 || (t.isSwarmer && t.life <= 0)){
            if(!t.isSwarmer && t.generation < 4){
                spawnDrone(t.x, t.y, t.angle+1, t.generation+1);
                spawnDrone(t.x, t.y, t.angle-1, t.generation+1);
            }
            createExplosion(t.x, t.y, t.isSwarmer ? '#ffcc00' : '#00ff88', 10, t.scale);
            teammates.splice(i, 1);
        }
    }
}

function updateProjectiles(dt){
    for(let i=projectiles.length-1; i>=0; i--){
        const p = projectiles[i];
        p.life -= dt;
        p.x += p.vx; p.y += p.vy;
        
        if(p.isEnemy) {
            // Check collision with player
            if(Math.hypot(player.x-p.x, player.y-p.y) < player.radius + p.size) {
                player.hull -= (p.type === 'heavy' ? 15 : (p.type === 'laser' ? 2 : 5));
                GAME.shake = 3;
                if(p.type !== 'laser') p.life = 0;
                createExplosion(p.x, p.y, p.color, 5);
            }
            // Check collision with drones
            teammates.forEach(t => {
                if (p.life > 0 && Math.hypot(t.x-p.x, t.y-p.y) < t.radius + p.size) {
                    t.hp -= (p.type === 'heavy' ? 25 : (p.type === 'laser' ? 5 : 15));
                    if(p.type !== 'laser') p.life = 0;
                    createExplosion(p.x, p.y, p.color, 3);
                }
            });
            // Enemy Missile Homing logic (prioritize drones)
            if(p.type === 'missile' && p.state === 'engaging') {
                let tgt = player, md = Math.hypot(player.x-p.x, player.y-p.y);
                teammates.forEach(t => {
                    let d = Math.hypot(t.x-p.x, t.y-p.y);
                    if(d < md) { md = d; tgt = t; }
                });
                const ta = Math.atan2(tgt.y-p.y, tgt.x-p.x);
                p.angle += (ta-p.angle)*0.06;
                p.vx = Math.cos(p.angle)*6; p.vy = Math.sin(p.angle)*6;
            }

        } else {
            // Player/Drone Projectiles targeting enemies and bosses
            if(p.type === 'missile' && p.state === 'engaging'){
                let tgt = null, md = Infinity;
                enemies.forEach(e => { let d = Math.hypot(e.x-p.x, e.y-p.y); if(d<md){ md=d; tgt=e; } });
                bosses.forEach(b => { let d = Math.hypot(b.x-p.x, b.y-p.y); if(d<md){ md=d; tgt=b; } });
                if(tgt){
                    const ta = Math.atan2(tgt.y-p.y, tgt.x-p.x);
                    p.angle += (ta-p.angle)*0.12;
                    p.vx = Math.cos(p.angle)*8.5; p.vy = Math.sin(p.angle)*8.5;
                }
            }
            
            enemies.forEach(e => {
                if(Math.hypot(e.x-p.x, e.y-p.y) < e.radius + p.size){
                    if(p.type === 'chrono'){ e.slowTimer = 4; e.hp -= 20; p.life = 0; }
                    else if(p.type === 'nova'){ e.hp -= 400*dt; }
                    else { e.hp -= (p.type === 'missile' ? 80 : 40); p.life = 0; }
                    if(p.life <= 0) createExplosion(p.x, p.y, p.color, 12);
                }
            });
            
            bosses.forEach(b => {
                if(Math.hypot(b.x-p.x, b.y-p.y) < b.radius + p.size){
                    if(p.type === 'chrono'){ b.slowTimer = 2; b.hp -= 15; p.life = 0; }
                    else if(p.type === 'nova'){ b.hp -= 150*dt; }
                    else { b.hp -= (p.type === 'missile' ? 50 : 25); p.life = 0; }
                    if(p.life <= 0) createExplosion(p.x, p.y, p.color, 12);
                }
            });
        }
        
        if(p.life <= 0) projectiles.splice(i, 1);
    }
}

function updateEnemies(dt){
    for(let i=enemies.length-1; i>=0; i--){
        const e = enemies[i];
        if(e.slowTimer > 0){ e.slowTimer -= dt; e.speed = e.baseSpeed*0.2; }
        else e.speed = e.baseSpeed;
        
        const angle = Math.atan2(player.y-e.y, player.x-e.x);
        e.x += Math.cos(angle)*e.speed; 
        e.y += Math.sin(angle)*e.speed; 
        e.angle = angle;
        
        if(Math.hypot(e.x-player.x, e.y-player.y) < player.radius + e.radius){
            player.hull -= (e.type === 'bomber' ? 25 : 1.0);
            GAME.shake = (e.type === 'bomber' ? 15 : 10);
            e.x -= Math.cos(angle)*40; e.y -= Math.sin(angle)*40;
            if (e.type === 'bomber') e.hp = 0; // Destroy bomber on impact
        }
        
        if(e.hp <= 0){
            createExplosion(e.x, e.y, e.color, 40, e.type === 'heavy' ? 4 : 2);
            if (e.type === 'bomber') {
                // Bomber explosion damages player/drones
                if (Math.hypot(player.x-e.x, player.y-e.y) < 100) player.hull -= 10;
                teammates.forEach(t => { if(Math.hypot(t.x-e.x, t.y-e.y) < 100) t.hp -= 30; });
            }
            GAME.score += (e.type === 'heavy' ? 1000 : 250);
            GAME.exp += (e.type === 'heavy' ? 100 : 40);
            enemies.splice(i, 1);
            // Only spawn replacement if it's a standard enemy (not minion overflow)
            if (enemies.length < 15) spawnEnemy(); 
        }
    }
    
    if(GAME.exp >= GAME.expToNext){
        GAME.level++; GAME.exp = 0; 
        GAME.expToNext = Math.floor(GAME.expToNext*1.4); 
        player.hull = Math.min(100, player.hull+40); 
        spawnEnemy();
    }
}

function updateBosses(dt){
    for(let i=bosses.length-1; i>=0; i--){
        const b = bosses[i];
        b.timer += dt;
        b.minionsTimer += dt;
        if(b.slowTimer > 0) b.slowTimer -= dt;

        // BOSS TARGET ACQUISITION: Prioritize Drones!
        let target = player;
        let md = Math.hypot(player.x-b.x, player.y-b.y);
        teammates.forEach(t => {
            let d = Math.hypot(t.x-b.x, t.y-b.y);
            if(d < md) { md = d; target = t; }
        });

        const angle = Math.atan2(target.y-b.y, target.x-b.x);
        // Smooth rotation for visual
        let angleDiff = angle - b.angle;
        // Normalize angleDiff
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        b.angle += angleDiff * 0.05; 

        let bSpeedMult = b.slowTimer > 0 ? 0.3 : 1;

        if (b.type === 1) { // Aegis Cruiser (Easiest)
            // Stays at medium range, fires spreads
            if (md > 250) { b.x += Math.cos(angle)*1.5*bSpeedMult; b.y += Math.sin(angle)*1.5*bSpeedMult; }
            
            if (b.timer > 1.8) {
                for(let j=-2; j<=2; j++) {
                    let a = angle + j*0.15;
                    projectiles.push({x: b.x, y: b.y, vx: Math.cos(a)*5, vy: Math.sin(a)*5, life: 4, size: 8, color: '#ff8800', isEnemy: true, type: 'basic'});
                }
                b.timer = 0;
            }
            if (b.minionsTimer > 7) {
                for(let k=0; k<2; k++) spawnEnemy(b.x + (Math.random()-0.5)*100, b.y + (Math.random()-0.5)*100, 'basic');
                b.minionsTimer = 0;
            }

        } else if (b.type === 2) { // Void Ray (Medium)
            // Erratic dashing and lasers
            if (b.dashState === 0) {
                if (md > 150) { b.x += Math.cos(angle)*2*bSpeedMult; b.y += Math.sin(angle)*2*bSpeedMult; }
                if (b.timer > 3) { b.dashState = 1; b.timer = 0; b.dashAngle = angle; }
            } else if (b.dashState === 1) {
                b.x += Math.cos(b.dashAngle)*12*bSpeedMult; b.y += Math.sin(b.dashAngle)*12*bSpeedMult;
                if (b.timer > 0.05) { // Leave laser trail
                    projectiles.push({x: b.x, y: b.y, vx: 0, vy: 0, life: 1.5, size: 10, color: '#ff00ff', isEnemy: true, type: 'laser'});
                    b.timer = 0;
                }
                if (b.minionsTimer > 3) { b.dashState = 0; b.minionsTimer = 0; } // Hack: reuse minion timer for dash duration
            }

            if (b.dashState === 0 && b.minionsTimer > 6) {
                spawnEnemy(b.x, b.y, 'bomber');
                b.minionsTimer = 0;
            }

        } else if (b.type === 3) { // Nexus Dreadnought (Hardest)
            // Massive tank, bullet hell, spawns singularities and heavy minions
            if (md > 300) { b.x += Math.cos(angle)*0.8*bSpeedMult; b.y += Math.sin(angle)*0.8*bSpeedMult; }
            
            // Bullet hell spiral
            if (b.timer > 0.15) {
                let a = (GAME.lastTime/1000) * 5; // Constantly rotating angle
                for(let j=0; j<4; j++){
                    let spreadA = a + (Math.PI/2)*j;
                    projectiles.push({x: b.x, y: b.y, vx: Math.cos(spreadA)*4.5, vy: Math.sin(spreadA)*4.5, life: 6, size: 12, color: '#ff0000', isEnemy: true, type: 'heavy'});
                }
                b.timer = 0;
            }
            
            if (b.minionsTimer > 4 && b.minionsTimer < 4.1) {
                // Fire seeking missiles
                projectiles.push({x: b.x, y: b.y, vx: Math.cos(angle)*2, vy: Math.sin(angle)*2, life: 10, size: 15, type: 'missile', state: 'engaging', angle: angle, color: '#ff3300', isEnemy: true});
            }

            if (b.minionsTimer > 10) {
                spawnEnemy(b.x, b.y, 'heavy');
                singularities.push({x: target.x, y: target.y, vx: 0, vy: 0, life: 3.5, radius: 0, maxRadius: 250, isEnemy: true});
                b.minionsTimer = 0;
            }
        }

        // Damage checking happens in updateProjectiles, but collision with player:
        if (Math.hypot(b.x-player.x, b.y-player.y) < b.radius + player.radius) {
            player.hull -= 2.0; GAME.shake = 15;
            player.x -= Math.cos(angle)*30; player.y -= Math.sin(angle)*30;
        }

        // Death
        if (b.hp <= 0) {
            createExplosion(b.x, b.y, b.color, 200, 10);
            GAME.score += b.score;
            GAME.exp += 500;
            GAME.shake = 40;
            // Clear screen of enemy projectiles on boss kill for relief
            projectiles = projectiles.filter(p => !p.isEnemy);
            bosses.splice(i, 1);
        }
    }
}

function updateParticles(dt){
    for(let i=particles.length-1; i>=0; i--){
        const p = particles[i];
        p.life -= dt;
        if(p.type === 'bolt'){ if(p.life <= 0) particles.splice(i, 1); continue; }
        p.x += p.vx; p.y += p.vy;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

function draw(){
    ctx.fillStyle = '#000810'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    if(GAME.shake > 0) ctx.translate((Math.random()-0.5)*GAME.shake, (Math.random()-0.5)*GAME.shake);
    
    // Background Stars
    stars.forEach(s => {
        ctx.fillStyle = `rgba(255,255,255,${0.4+s.speed})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
        s.y += s.speed;
        if(s.y > canvas.height) {
            s.y = 0;
            s.x = Math.random() * canvas.width; // Randomize horizontal position on loop
        }
    });
    
    // Singularities (Black holes)
    singularities.forEach(s => {
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.radius);
        g.addColorStop(0, '#000');
        g.addColorStop(0.5, s.isEnemy ? 'rgba(255,0,0,0.8)' : 'rgba(102,0,255,0.8)');
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = s.isEnemy ? '#ff5555' : '#fff';
        ctx.lineWidth = 2; ctx.stroke();
    });
    
    // Particles / Lightning
    particles.forEach(p => {
        if(p.type === 'bolt'){
            ctx.strokeStyle = `rgba(200,255,255,${p.life*3})`;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(p.x1, p.y1);
            let cx = p.x1, cy = p.y1;
            for(let j=0; j<5; j++){
                cx += (p.x2-p.x1)/5 + (Math.random()-0.5)*30;
                cy += (p.y2-p.y1)/5 + (Math.random()-0.5)*30;
                ctx.lineTo(cx, cy);
            }
            ctx.lineTo(p.x2, p.y2); ctx.stroke();
        } else {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
        }
    });
    ctx.globalAlpha = 1;
    
    // Draw Enemies
    enemies.forEach(e => {
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.angle);
        ctx.strokeStyle = e.slowTimer > 0 ? '#cc00ff' : e.color;
        ctx.shadowBlur = 15; ctx.shadowColor = ctx.strokeStyle;
        ctx.beginPath();
        if (e.type === 'bomber') {
            ctx.arc(0, 0, 12, 0, Math.PI*2);
            ctx.moveTo(0, 0); ctx.lineTo(16, 0);
        } else if (e.type === 'heavy') {
            ctx.moveTo(30, 0); ctx.lineTo(-20, -25); ctx.lineTo(-10, 0); ctx.lineTo(-20, 25);
        } else { // basic
            ctx.moveTo(22, 0); ctx.lineTo(-14, -16); ctx.lineTo(-8, 0); ctx.lineTo(-14, 16);
        }
        ctx.closePath(); ctx.stroke();
        ctx.restore();
    });
    
    bosses.forEach(b => {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.angle);
        ctx.shadowBlur = 20; ctx.shadowColor = b.color;
        ctx.strokeStyle = b.slowTimer > 0 ? '#fff' : b.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        
        if (b.type === 1) { // Aegis (Diamond shape)
            ctx.moveTo(b.radius, 0); ctx.lineTo(0, -b.radius/1.5); 
            ctx.lineTo(-b.radius, 0); ctx.lineTo(0, b.radius/1.5);
        } else if (b.type === 2) { // Void Ray (Fork/Trident)
            ctx.moveTo(b.radius, 0); ctx.lineTo(-b.radius, -b.radius*0.8); 
            ctx.lineTo(-b.radius*0.4, 0); ctx.lineTo(-b.radius, b.radius*0.8);
        } else if (b.type === 3) { // Nexus Dreadnought (Massive Octagon/Gear)
            for(let i=0; i<8; i++) {
                let a = i * Math.PI/4;
                // Add ridges
                let r = (i%2 === 0) ? b.radius : b.radius*0.7;
                ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
            }
        }
        ctx.closePath(); ctx.stroke();
        
        // Inner detail
        ctx.beginPath(); ctx.arc(0,0, b.radius/3, 0, Math.PI*2); ctx.stroke();
        ctx.restore();

        // Direct Canvas Boss HP Bar
        const barWidth = Math.max(60, b.radius * 2);
        const barHeight = 6;
        const barYOffset = b.radius + 20;
        
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(b.x - barWidth/2, b.y - barYOffset, barWidth, barHeight);
        
        ctx.fillStyle = b.color;
        // Ensure HP ratio doesn't go below 0 for rendering
        const hpRatio = Math.max(0, b.hp / b.maxHp); 
        ctx.fillRect(b.x - barWidth/2, b.y - barYOffset, barWidth * hpRatio, barHeight);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; 
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x - barWidth/2, b.y - barYOffset, barWidth, barHeight);
        
        // Boss Name Tag
        ctx.fillStyle = '#fff';
        ctx.font = '9px Orbitron';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#000';
        ctx.fillText(b.name, b.x, b.y - barYOffset - 5);
        ctx.shadowBlur = 0; // Reset shadow for next draws
    });

    // Draw Drones (Teammates)
    teammates.forEach(t => {
        ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.angle); ctx.scale(t.scale, t.scale);
        ctx.strokeStyle = t.isSwarmer ? '#ffcc00' : '#00ff88';
        ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-12, -12); ctx.lineTo(-6, 0); ctx.lineTo(-12, 12);
        ctx.closePath(); ctx.stroke();
        ctx.restore();
    });
    
    // Draw Projectiles
    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 15; ctx.shadowColor = p.color;
        if(p.type === 'missile'){
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
            ctx.fillRect(-10, -5, 20, 10); ctx.restore();
        } else if(p.type === 'nova'){
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
            g.addColorStop(0, '#fff'); g.addColorStop(0.4, 'rgba(0,242,255,0.6)'); g.addColorStop(1, 'transparent');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
    });
    
    // Draw Player
    ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
    ctx.strokeStyle = '#00f2ff'; ctx.lineWidth = 4;
    ctx.shadowBlur = 20; ctx.shadowColor = '#00f2ff';
    ctx.beginPath(); ctx.moveTo(28, 0); ctx.lineTo(-20, -22); ctx.lineTo(-12, 0); ctx.lineTo(-20, 22);
    ctx.closePath(); ctx.stroke();
    ctx.restore();

    // Draw Custom Glowing Targeting Cursor
    ctx.save();
    ctx.translate(mouseX, mouseY);
    ctx.strokeStyle = '#00f2ff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f2ff';
    ctx.lineWidth = 2;
    // Reticle lines
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(-5, 0);
    ctx.moveTo(15, 0); ctx.lineTo(5, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, -5);
    ctx.moveTo(0, 15); ctx.lineTo(0, 5);
    ctx.stroke();
    // Center dot
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI*2);
    ctx.fillStyle = '#00f2ff';
    ctx.fill();
    ctx.restore();
    
    ctx.restore(); // Restore global context
    
    // Update DOM UI
    document.getElementById('hull-bar').style.width = Math.max(0, player.hull) + '%';
    document.getElementById('energy-bar').style.width = player.energy + '%';
    document.getElementById('exp-bar').style.width = (GAME.exp/GAME.expToNext*100) + '%';
    document.getElementById('score-val').innerText = GAME.score.toString().padStart(6, '0');
    document.getElementById('lvl-display').innerText = 'LVL ' + GAME.level;
    
    if(player.hull <= 0){
        GAME.isRunning = false; // Stop updating
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0044'; ctx.font = '50px Orbitron'; ctx.textAlign = 'center';
        ctx.shadowBlur = 20; ctx.shadowColor = '#ff0044';
        ctx.fillText('CRITICAL FAILURE', canvas.width/2, canvas.height/2);
        
        // Optional: Reset logic could go here after a delay
    }
}

// Event Listeners
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('mousedown', e => { if(e.button === 0) keys['MouseDown0'] = true; });
window.addEventListener('mouseup', e => { if(e.button === 0) keys['MouseDown0'] = false; });
window.addEventListener('mousemove', e => {
    // Update custom cursor position
    mouseX = e.clientX;
    mouseY = e.clientY;
});
window.addEventListener('resize', resize);
window.addEventListener('contextmenu', e => e.preventDefault());

init();
</script>
