<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra-Cluck Banana Tycoon: Mega Chaos Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');
        body { background-color: #2ecc71; font-family: 'Comic Neue', cursive; overflow: hidden; touch-action: manipulation; }
        .chicken-container { transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10; }
        .banana-particle { position: absolute; pointer-events: none; animation: floatUp 1s ease-out forwards; font-size: 2.5rem; z-index: 100; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-200px) rotate(360deg); opacity: 0; } }
        .chaos-sprite { position: absolute; pointer-events: none; animation: chaosMove 3s linear forwards; z-index: 5; font-size: 3rem; }
        @keyframes chaosMove { 0% { transform: translate(0, 0) rotate(0deg) scale(0.5); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) rotate(720deg) scale(2); opacity: 0; } }
        .event-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 500; pointer-events: none; font-size: 4rem; font-weight: 900; text-shadow: 4px 4px 0px black; color: white; text-align: center; opacity: 0; transition: opacity 0.3s; padding: 20px; }
        .event-active { opacity: 1; }
        .glitch-bg { animation: glitch 0.1s infinite; }
        @keyframes glitch { 0% { background-color: #ff00ff; } 33% { background-color: #00ffff; } 66% { background-color: #ffff00; } 100% { background-color: #ff00ff; } }
        .shake { animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(15px, 15px); } 50% { transform: translate(-15px, 0); } 75% { transform: translate(0, -15px); } 100% { transform: translate(0,0); } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center select-none overflow-hidden">
    <div id="event-text" class="event-overlay"></div>
    <div class="fixed top-0 w-full p-4 flex justify-between items-start z-[200]">
        <div class="bg-white/90 p-4 rounded-xl border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
            <h1 class="text-2xl">🍌 BANANAS: <span id="counter">0</span></h1>
            <p class="text-sm">Bps: <span id="bps">0</span></p>
        </div>
        <div class="flex flex-col gap-2">
            <button onclick="toggleShop()" class="bg-yellow-400 p-4 rounded-xl border-4 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-y-1 transition-all font-bold">🛒 DUM SHOP</button>
        </div>
    </div>
    <div id="game-area" class="relative w-full h-full flex items-center justify-center">
        <div id="chicken-hitbox" class="chicken-container cursor-pointer relative group">
            <div id="chicken-sprite" class="relative">
                <img id="main-chicken" src="https://pngimg.com/uploads/chicken/chicken_PNG2145.png" alt="Hyper Realistic Chicken" class="w-64 md:w-80 drop-shadow-2xl" onerror="this.style.fontSize='12rem';this.outerHTML='<div style=&quot;font-size:12rem&quot;>🐔</div>'">
                <div id="quote-bubble" class="absolute -top-24 -right-24 bg-white border-4 border-black p-3 rounded-2xl hidden text-lg font-bold max-w-[200px] shadow-lg">"Skibidi?"</div>
            </div>
        </div>
    </div>
    <div id="shop-modal" class="fixed inset-0 bg-black/70 hidden z-[300] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md border-8 border-yellow-500 p-6 rounded-3xl overflow-y-auto max-h-[80vh] shadow-[20px_20px_0px_0px_rgba(0,0,0,0.5)]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-4xl font-black">STUFF TO BUY</h2>
                <button onclick="toggleShop()" class="text-3xl bg-red-500 text-white rounded-full w-12 h-12 border-4 border-black">X</button>
            </div>
            <div class="space-y-4">
                <div onclick="buyUpgrade('peel')" class="border-4 border-black p-3 rounded-xl cursor-pointer hover:bg-yellow-100 flex justify-between items-center bg-gray-50">
                    <div><h3 class="font-bold text-xl">Hover-Peel</h3><p class="text-sm">+2 Banana per click</p></div>
                    <div class="text-right"><span class="block font-bold text-xl" id="cost-peel">50</span><span class="text-xs">🍌</span></div>
                </div>
                <div onclick="buyUpgrade('auto')" class="border-4 border-black p-3 rounded-xl cursor-pointer hover:bg-green-100 flex justify-between items-center bg-gray-50">
                    <div><h3 class="font-bold text-xl">Auto-Cluck</h3><p class="text-sm">+1 banana per second passively</p></div>
                    <div class="text-right"><span class="block font-bold text-xl" id="cost-auto">100</span><span class="text-xs">🍌</span></div>
                </div>
                <div onclick="buyUpgrade('chaos')" class="border-4 border-black p-3 rounded-xl cursor-pointer hover:bg-blue-100 flex justify-between items-center bg-gray-50">
                    <div><h3 class="font-bold text-xl">Auto-Chaos</h3><p class="text-sm">Random stuff spawns more often</p></div>
                    <div class="text-right"><span class="block font-bold text-xl" id="cost-chaos">500</span><span class="text-xs">🍌</span></div>
                </div>
                <div onclick="buyUpgrade('brainrot')" class="border-4 border-black p-3 rounded-xl cursor-pointer hover:bg-pink-100 flex justify-between items-center bg-gray-50">
                    <div><h3 class="font-bold text-xl">MAX BRAINROT</h3><p class="text-sm">Permanent Shake + Chaos</p></div>
                    <div class="text-right"><span class="block font-bold text-xl" id="cost-brainrot">2500</span><span class="text-xs">🍌</span></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let bananas = 0, bananasPerClick = 1, bananasPerSecond = 0;
        const state = {
            chaosLevel: 0, brainrotActive: false,
            upgrades: {
                peel:     { cost: 50,   count: 0 },
                auto:     { cost: 100,  count: 0 },
                chaos:    { cost: 500,  count: 0 },
                brainrot: { cost: 2500, count: 0 }
            }
        };
        const chaosSprites = ["🚀","ඞ","🕺","🍔","💀","🔥","💎","🤡","🥶","👽","👾","🤖","🌮","🍦","💩","🦄","🌈","🍕","🎮","🛹"];
        const events = [
            { name: "SUS INVASION", icon: "ඞ", count: 40 },
            { name: "TACO RAIN", icon: "🌮", count: 50 },
            { name: "DANCE PARTY", icon: "🕺", count: 30 },
            { name: "FORTNITE DEFAULT DANCE", icon: "👑", count: 20 },
            { name: "BRAINROT FLASH", icon: "💀", count: 60 },
            { name: "FLYING BURRITO RAIN", icon: "🌯", count: 50 },
            { name: "GIANT GHOST ATTACK", icon: "👻", count: 40 },
            { name: "PIZZA PARTY TIME", icon: "🍕", count: 45 },
            { name: "DUMMY BUTTON OVERLOAD", icon: "🔘", count: 70 },
            { name: "TOILET PAPER CRISIS", icon: "🧻", count: 60 },
            { name: "ALIEN ABDUCTION", icon: "🛸", count: 35 },
            { name: "RAINBOW VOMIT", icon: "🌈", count: 80 }
        ];
        const counterEl = document.getElementById('counter');
        const bpsEl = document.getElementById('bps');
        const chicken = document.getElementById('chicken-hitbox');
        const eventText = document.getElementById('event-text');
        chicken.addEventListener('mousedown', (e) => clickChicken(e.clientX, e.clientY));
        chicken.addEventListener('touchstart', (e) => { e.preventDefault(); const t=e.touches[0]; clickChicken(t.clientX, t.clientY); }, {passive:false});
        function clickChicken(x, y) {
            bananas += bananasPerClick; updateDisplay();
            spawnParticle(x, y, "🍌");
            chicken.classList.add('scale-75', 'rotate-12');
            setTimeout(() => chicken.classList.remove('scale-75', 'rotate-12'), 100);
        }
        function spawnParticle(x, y, text) {
            const p = document.createElement('div');
            p.className = 'banana-particle font-black';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.innerText = text; p.style.color = `hsl(${Math.random()*360},100%,50%)`;
            document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
        }
        function triggerRandomEvent() {
            const ev = events[Math.floor(Math.random() * events.length)];
            eventText.innerText = ev.name; eventText.classList.add('event-active');
            document.body.classList.add('shake');
            for(let i=0; i<ev.count; i++) setTimeout(() => spawnChaos(ev.icon), i * 50);
            if (Math.random() > 0.5) setTimeout(() => spawnGiantChaos(ev.icon), 500);
            setTimeout(() => {
                eventText.classList.remove('event-active');
                if (!state.brainrotActive) document.body.classList.remove('shake');
            }, 3000);
        }
        function spawnChaos(customIcon = null) {
            const p = document.createElement('div'); p.className = 'chaos-sprite';
            p.style.left = Math.random()*100+'vw'; p.style.top = Math.random()*100+'vh';
            const tx=(Math.random()-0.5)*1200, ty=(Math.random()-0.5)*1200;
            p.style.setProperty('--tx', tx+'px'); p.style.setProperty('--ty', ty+'px');
            p.innerText = customIcon || chaosSprites[Math.floor(Math.random()*chaosSprites.length)];
            document.body.appendChild(p); setTimeout(() => p.remove(), 3000);
        }
        function spawnGiantChaos(icon) {
            const p = document.createElement('div'); p.className = 'chaos-sprite';
            p.style.fontSize='15rem'; p.style.left='50%'; p.style.top='50%';
            p.style.transform='translate(-50%,-50%)'; p.style.setProperty('--tx','0px'); p.style.setProperty('--ty','0px');
            p.innerText=icon; p.style.zIndex="100";
            document.body.appendChild(p); setTimeout(() => p.remove(), 2000);
        }
        function updateDisplay() { counterEl.innerText=Math.floor(bananas); bpsEl.innerText=Math.floor(bananasPerSecond); }
        function toggleShop() { document.getElementById('shop-modal').classList.toggle('hidden'); }
        function buyUpgrade(type) {
            const up = state.upgrades[type];
            if (bananas >= up.cost) {
                bananas -= up.cost; up.count++;
                if (type === 'peel') { bananasPerClick += 2; up.cost = Math.floor(up.cost * 1.5); }
                else if (type === 'auto') { bananasPerSecond += 1 + up.count; up.cost = Math.floor(up.cost * 1.6); }
                else if (type === 'chaos') { state.chaosLevel++; up.cost = Math.floor(up.cost * 2); }
                else if (type === 'brainrot') {
                    state.brainrotActive = true;
                    document.body.classList.add('glitch-bg','shake');
                    document.getElementById('quote-bubble').classList.remove('hidden');
                    up.cost = 9999999;
                    setInterval(() => {
                        const words=["GYATT","RIZZ","OHIO","MOG","SIGMA","L","RATIO","SKIBIDI","BUSSIN","NPC"];
                        document.getElementById('quote-bubble').innerText = words[Math.floor(Math.random()*words.length)]+"??";
                    }, 1500);
                }
                const costEl = document.getElementById(`cost-${type}`);
                if(costEl) costEl.innerText = up.cost > 1000000 ? "MAX" : up.cost;
                updateDisplay();
            }
        }
        setInterval(() => {
            bananas += (bananasPerSecond / 10); updateDisplay();
            if (state.chaosLevel > 0 && Math.random() < (0.05 * state.chaosLevel)) spawnChaos();
        }, 100);
        setInterval(triggerRandomEvent, 5000);
        let keys = "";
        window.addEventListener('keydown', (e) => {
            keys += e.key.toUpperCase();
            if (keys.includes("FORTNITE")) { bananas += 5000; keys = ""; spawnParticle(window.innerWidth/2, window.innerHeight/2, "VICTORY ROYALE!"); }
            if (keys.length > 10) keys = keys.substring(1);
        });
    </script>
</body>
</html>
