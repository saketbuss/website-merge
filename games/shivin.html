<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>The Abyssal Archive: Haunted Protocol</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
 <style>
 body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
 #overlay {
 position: fixed; top: 0; left: 0; width: 100%; height: 100%;
 background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(0,0,0,0.9) 100%);
 pointer-events: none; z-index: 50;
 }
 #scanline-overlay {
 position: fixed; top: 0; left: 0; width: 100%; height: 100%;
 background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 2px);
 pointer-events: none; z-index: 51; opacity: 0.5;
 }
 #ui {
 position: absolute; top: 30px; left: 30px; color: #fff;
 text-shadow: 0 0 10px rgba(0,255,200,1); pointer-events: none; z-index: 10;
 font-size: 14px; text-transform: uppercase; letter-spacing: 2px; line-height: 1.8;
 }
 #minimap-container {
 position: absolute; top: 30px; right: 30px;
 width: 160px; height: 160px;
 background: rgba(0, 15, 10, 0.95);
 border: 2px solid #00ffcc;
 z-index: 60; overflow: hidden;
 box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
 border-radius: 4px;
 }
 #minimap-canvas { width: 100%; height: 100%; }
 #subtitles {
 position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
 color: #ff3333; font-size: 16px; text-align: center; width: 60%;
 text-shadow: 2px 2px 8px #000; pointer-events: none; z-index: 20;
 opacity: 0; transition: opacity 0.5s; font-weight: bold;
 background: rgba(0,0,0,0.4); padding: 10px; border-radius: 5px;
 }
 #stamina-container {
 position: absolute; bottom: 40px; left: 50%;
 transform: translateX(-50%); width: 250px; height: 6px;
 z-index: 10; background: rgba(255,255,255,0.05);
 border-radius: 3px; border: 1px solid rgba(0, 255, 204, 0.2);
 }
 #stamina-bar { width: 100%; height: 100%; background: #00ffcc; border-radius: 3px; transition: width 0.1s linear; }
 #menu {
 position: absolute; top: 0; left: 0; width: 100%; height: 100%;
 background: #050505; color: #fff; display: flex; flex-direction: column;
 justify-content: center; align-items: center; z-index: 100;
 }
 .lvl-btn {
 background: transparent; color: #fff; padding: 15px 50px;
 border: 1px solid #00ffcc; cursor: pointer; margin: 20px;
 font-family: 'Courier New', Courier, monospace;
 text-transform: uppercase; letter-spacing: 5px;
 transition: 0.3s;
 box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.1);
 }
 .lvl-btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 30px rgba(0,255,204,0.6); }
 #jumpscare {
 position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
 display: none; z-index: 1000; background: #000;
 justify-content: center; align-items: center;
 }
 .monster-visage {
 width: 500px; height: 600px; background: #c2b9a1;
 position: relative; border: 15px solid #200;
 box-shadow: 0 0 200px #600;
 animation: lunge-shake 0.15s ease-out forwards;
 }
 .scare-eye {
 position: absolute; width: 90px; height: 50px; background: #050505;
 border-radius: 50%; top: 25%; overflow: hidden;
 box-shadow: 0 12px 20px rgba(0,0,0,0.9);
 }
 .scare-eye::after {
 content: ''; position: absolute; width: 25px; height: 25px;
 background: #ff0000; border-radius: 50%; left: 32px; top: 12px;
 box-shadow: 0 0 15px #f00;
 }
 .eyebag-scare {
 position: absolute; width: 110px; height: 40px; background: rgba(40, 10, 10, 0.8);
 border-radius: 50%; top: 34%; z-index: -1; filter: blur(8px);
 }
 .scare-smile {
 position: absolute; width: 300px; height: 120px;
 border: 10px solid #000; border-radius: 0 0 150px 150px;
 bottom: 18%; left: 100px; border-top: 0;
 }
 @keyframes lunge-shake {
 0% { transform: scale(0.3); opacity: 0; filter: contrast(200%); }
 100% { transform: scale(4.0); opacity: 1; filter: contrast(100%); }
 }
 #power-outage-fx {
 position: fixed; top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(255, 0, 0, 0.03); pointer-events: none;
 display: none; z-index: 45; animation: flicker 0.1s infinite;
 }
 @keyframes flicker {
 0% { opacity: 0.1; }
 50% { opacity: 0.3; }
 100% { opacity: 0.1; }
 }
 </style>
</head>
<body onclick="document.body.focus()">
 <div id="overlay"></div>
 <div id="scanline-overlay"></div>
 <div id="power-outage-fx"></div>
 <div id="ui">
 // SYSTEM_NODE_84<br>
 // DATA_SLABS_EXTRACTED: <span id="keyCount">0</span>/3<br>
 // ENERGY_LEVEL: <span id="grid-sign" style="color:#00ffcc">OPTIMAL</span>
 </div>
 <div id="minimap-container">
 <canvas id="minimap-canvas"></canvas>
 </div>
 <div id="subtitles"></div>
 <div id="stamina-container">
 <div id="stamina-bar"></div>
 </div>
 <div id="menu">
 <h1 style="letter-spacing: 15px; font-size: 38px; margin-bottom: 5px; color: #00ffcc;">ABYSSAL_ARCHIVE</h1>
 <p style="color: #666; margin-bottom: 10px; font-size: 13px;">HAUNTED_PROTOCOL_V15_ULTIMATE</p>
 <p style="color: #444; margin-bottom: 30px; font-size: 11px; letter-spacing: 2px;">BY SHIVIN JINDAL</p>
 <div class="lvl-btn" onclick="start()">INITIATE_SESSION</div>
 <p style="color: #444; font-size: 10px; margin-top: 10px;">WASD or ARROWS to Move | SHIFT to Sprint | Mouse to Look</p>
 </div>
 <div id="jumpscare">
 <div class="monster-visage">
 <div class="eyebag-scare" style="left: 12%;"></div>
 <div class="eyebag-scare" style="right: 12%;"></div>
 <div class="scare-eye" style="left: 15%;"></div>
 <div class="scare-eye" style="right: 15%;"></div>
 <div class="scare-smile"></div>
 </div>
 </div>

 <script>
 let scene, camera, renderer, flashLight, ambient;
 let keys = [], monsters = [], walls = [], exitDoor = null;
 let keyCount = 0, isDead = false, gameStarted = false, exitAvailable = false;
 let stamina = 100, isPowerOut = false;
 let audioCtx;
 let minimapCtx, minimapCanvas;

 const config = { monsters: 5, speed: 0.11, mapSize: 220 };
 const moveState = { forward: false, backward: false, left: false, right: false, shift: false };

 function showSubtitle(text) {
 const el = document.getElementById('subtitles');
 el.innerText = text;
 el.style.opacity = 1;
 setTimeout(() => { if(el.innerText === text) el.style.opacity = 0; }, 4000);
 }

 function createCreepyMusic() {
 try {
 audioCtx = new (window.AudioContext || window.webkitAudioContext)();
 const drone = audioCtx.createOscillator();
 drone.type = 'sawtooth';
 drone.frequency.setValueAtTime(35, audioCtx.currentTime);
 const lpf = audioCtx.createBiquadFilter();
 lpf.type = 'lowpass';
 lpf.frequency.setValueAtTime(100, audioCtx.currentTime);
 const droneGain = audioCtx.createGain();
 droneGain.gain.value = 0.12;
 drone.connect(lpf).connect(droneGain).connect(audioCtx.destination);
 drone.start();
 } catch(e) {}
 }

 function init() {
 scene = new THREE.Scene();
 scene.fog = new THREE.FogExp2(0x000000, 0.055);
 camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
 camera.position.set(0, 1.7, 0);
 renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
 renderer.setSize(window.innerWidth, window.innerHeight);
 renderer.setPixelRatio(window.devicePixelRatio);
 renderer.shadowMap.enabled = true;
 document.body.appendChild(renderer.domElement);
 minimapCanvas = document.getElementById('minimap-canvas');
 minimapCtx = minimapCanvas.getContext('2d');
 ambient = new THREE.AmbientLight(0x050505, 0.3);
 scene.add(ambient);
 flashLight = new THREE.SpotLight(0xfff6e6, 15);
 flashLight.angle = Math.PI / 8;
 flashLight.penumbra = 0.6;
 flashLight.decay = 1.4;
 flashLight.distance = 110;
 flashLight.castShadow = true;
 scene.add(flashLight);
 scene.add(flashLight.target);
 window.addEventListener('keydown', e => handleInput(e, true));
 window.addEventListener('keyup', e => handleInput(e, false));
 window.addEventListener('resize', onResize);
 window.addEventListener('mousedown', () => {
 if (gameStarted && !document.pointerLockElement) {
 document.body.requestPointerLock();
 }
 });
 }

 function handleInput(e, isDown) {
 const k = e.key.toLowerCase();
 if(k === 'w' || e.key === 'ArrowUp') moveState.forward = isDown;
 if(k === 's' || e.key === 'ArrowDown') moveState.backward = isDown;
 if(k === 'a' || e.key === 'ArrowLeft') moveState.left = isDown;
 if(k === 'd' || e.key === 'ArrowRight') moveState.right = isDown;
 if(e.key === 'Shift') moveState.shift = isDown;
 }

 function generateMaze() {
 const size = config.mapSize;

 // Floor
 const floorGeo = new THREE.PlaneGeometry(size, size);
 const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 1 });
 const floor = new THREE.Mesh(floorGeo, floorMat);
 floor.rotation.x = -Math.PI / 2;
 floor.receiveShadow = true;
 scene.add(floor);

 // Ceiling
 const ceilMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 1 });
 const ceil = new THREE.Mesh(new THREE.PlaneGeometry(size, size), ceilMat);
 ceil.rotation.x = Math.PI / 2;
 ceil.position.y = 12;
 scene.add(ceil);

 const wallMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });

 // Border walls to keep player inside
 const border = size / 2;
 [
 { pos: [0, 6, -border], rot: [0,0,0], dim: [size, 12, 3] },
 { pos: [0, 6, border],  rot: [0,0,0], dim: [size, 12, 3] },
 { pos: [-border, 6, 0], rot: [0,0,0], dim: [3, 12, size] },
 { pos: [border, 6, 0],  rot: [0,0,0], dim: [3, 12, size] },
 ].forEach(b => {
 const m = new THREE.Mesh(new THREE.BoxGeometry(...b.dim), wallMat);
 m.position.set(...b.pos);
 scene.add(m);
 walls.push(m);
 });

 // Interior walls
 for(let i=0; i<50; i++) {
 const isV = Math.random() > 0.5;
 const w = new THREE.Mesh(new THREE.BoxGeometry(isV?3:35, 12, isV?35:3), wallMat);
 w.position.set((Math.random()-0.5)*(size-30), 6, (Math.random()-0.5)*(size-30));
 scene.add(w);
 walls.push(w);
 }

 for(let i = 0; i < config.monsters; i++) {
 const m = createMonster();
 m.position.set((Math.random()-0.5)*(size-50), 0, (Math.random()-0.5)*(size-50));
 scene.add(m);
 monsters.push(m);
 }

 for(let i = 0; i < 3; i++) {
 const k = new THREE.Mesh(
 new THREE.BoxGeometry(1.5, 0.05, 1.5),
 new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: new THREE.Color(0x00ffcc), emissiveIntensity: 2 })
 );
 k.position.set((Math.random()-0.5)*(size-50), 0.3, (Math.random()-0.5)*(size-50));
 scene.add(k);
 keys.push(k);
 }

 exitDoor = new THREE.Mesh(
 new THREE.TorusKnotGeometry(2, 0.5, 100, 16),
 new THREE.MeshStandardMaterial({ color: 0x0099ff, emissive: new THREE.Color(0x0066ff), emissiveIntensity: 1 })
 );
 exitDoor.position.set((Math.random()-0.5)*(size-50), 4, (Math.random()-0.5)*(size-50));
 exitDoor.visible = false;
 scene.add(exitDoor);
 }

 function createFaceTexture() {
 const canvas = document.createElement('canvas');
 canvas.width = 256; canvas.height = 256;
 const ctx = canvas.getContext('2d');
 ctx.fillStyle = '#d2c9b1';
 ctx.fillRect(0, 0, 256, 256);
 ctx.fillStyle = '#0a0a0a';
 ctx.beginPath(); ctx.arc(80, 120, 18, 0, Math.PI*2); ctx.fill();
 ctx.beginPath(); ctx.arc(176, 120, 18, 0, Math.PI*2); ctx.fill();
 ctx.fillStyle = '#ff0000';
 ctx.beginPath(); ctx.arc(80, 120, 4, 0, Math.PI*2); ctx.fill();
 ctx.beginPath(); ctx.arc(176, 120, 4, 0, Math.PI*2); ctx.fill();
 ctx.strokeStyle = '#000000';
 ctx.lineWidth = 4;
 ctx.beginPath(); ctx.arc(128, 160, 60, 0.3, Math.PI - 0.3, false); ctx.stroke();
 return new THREE.CanvasTexture(canvas);
 }

 function createMonster() {
 const group = new THREE.Group();
 const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.7, 2, 8), new THREE.MeshStandardMaterial({ color: 0x111111 }));
 body.position.y = 1;
 group.add(body);
 const head = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.85, 0.4), new THREE.MeshStandardMaterial({ map: createFaceTexture() }));
 head.position.y = 2.4;
 group.add(head);
 return group;
 }

 function onResize() {
 camera.aspect = window.innerWidth / window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth, window.innerHeight);
 }

 function start() {
 createCreepyMusic();
 generateMaze();
 document.getElementById('menu').style.display = 'none';
 document.body.requestPointerLock();
 gameStarted = true;
 animate();
 showSubtitle("OBJECTIVE: RETRIEVE 3 DATA SLABS.");
 }

 function updateMinimap() {
 minimapCtx.clearRect(0, 0, 160, 160);
 const scale = 160 / config.mapSize;
 const centerX = 80, centerZ = 80;

 // Draw walls on minimap
 minimapCtx.fillStyle = 'rgba(0,255,204,0.15)';
 walls.forEach(w => {
 const wx = centerX + w.position.x * scale;
 const wz = centerZ + w.position.z * scale;
 minimapCtx.fillRect(wx - 3, wz - 3, 6, 6);
 });

 keys.forEach(k => {
 if(k.visible) {
 minimapCtx.fillStyle = '#00ffcc';
 minimapCtx.beginPath();
 minimapCtx.arc(centerX + k.position.x * scale, centerZ + k.position.z * scale, 3.5, 0, Math.PI*2);
 minimapCtx.fill();
 }
 });

 // Monsters on minimap (red)
 monsters.forEach(m => {
 const dist = m.position.distanceTo(camera.position);
 if(dist < 60) {
 minimapCtx.fillStyle = 'rgba(255,50,50,0.8)';
 minimapCtx.beginPath();
 minimapCtx.arc(centerX + m.position.x * scale, centerZ + m.position.z * scale, 3, 0, Math.PI*2);
 minimapCtx.fill();
 }
 });

 // Exit door
 if(exitDoor && exitDoor.visible) {
 minimapCtx.fillStyle = '#0099ff';
 minimapCtx.beginPath();
 minimapCtx.arc(centerX + exitDoor.position.x * scale, centerZ + exitDoor.position.z * scale, 5, 0, Math.PI*2);
 minimapCtx.fill();
 }

 // Player (white dot with direction indicator)
 minimapCtx.fillStyle = '#fff';
 minimapCtx.beginPath();
 minimapCtx.arc(centerX + camera.position.x * scale, centerZ + camera.position.z * scale, 4.5, 0, Math.PI*2);
 minimapCtx.fill();

 // Direction arrow
 const dir = new THREE.Vector3();
 camera.getWorldDirection(dir);
 minimapCtx.strokeStyle = '#ff4500';
 minimapCtx.lineWidth = 1.5;
 minimapCtx.beginPath();
 const px = centerX + camera.position.x * scale;
 const pz = centerZ + camera.position.z * scale;
 minimapCtx.moveTo(px, pz);
 minimapCtx.lineTo(px + dir.x * 9, pz + dir.z * 9);
 minimapCtx.stroke();
 }

 let lastTime = 0;
 function animate(ts) {
 if(isDead) return;
 requestAnimationFrame(animate);
 const dt = Math.min((ts - lastTime) / 16.67, 3);
 lastTime = ts;

 if (gameStarted) {
 const speed = (moveState.shift && stamina > 5) ? 0.36 * dt : 0.18 * dt;
 if(moveState.shift && (moveState.forward || moveState.backward)) stamina = Math.max(0, stamina - 1.4);
 else stamina = Math.min(100, stamina + 0.45);
 document.getElementById('stamina-bar').style.width = stamina + '%';

 const dir = new THREE.Vector3();
 camera.getWorldDirection(dir);
 dir.y = 0; dir.normalize();
 const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), dir).normalize();

 const nextPos = camera.position.clone();
 if(moveState.forward) nextPos.addScaledVector(dir, speed);
 if(moveState.backward) nextPos.addScaledVector(dir, -speed);
 if(moveState.left) nextPos.addScaledVector(side, speed);
 if(moveState.right) nextPos.addScaledVector(side, -speed);

 // Axis-separated collision with sliding
 const tryX = camera.position.clone(); tryX.x = nextPos.x;
 const tryZ = camera.position.clone(); tryZ.z = nextPos.z;
 let hitX = false, hitZ = false;
 const pBox = new THREE.Box3();
 for(let w of walls) {
 const wBox = new THREE.Box3().setFromObject(w);
 pBox.setFromCenterAndSize(tryX, new THREE.Vector3(1.1, 2, 1.1));
 if(pBox.intersectsBox(wBox)) hitX = true;
 pBox.setFromCenterAndSize(tryZ, new THREE.Vector3(1.1, 2, 1.1));
 if(pBox.intersectsBox(wBox)) hitZ = true;
 }
 if(!hitX) camera.position.x = nextPos.x;
 if(!hitZ) camera.position.z = nextPos.z;
 camera.position.y = 1.7;

 monsters.forEach(m => {
 const dist = m.position.distanceTo(camera.position);
 if(dist < 90) {
 m.lookAt(camera.position.x, m.position.y, camera.position.z);
 const v = new THREE.Vector3().subVectors(camera.position, m.position).normalize();
 // Monster wall collision — don't let monsters phase through walls
 const mNext = m.position.clone().addScaledVector(v, (config.speed + keyCount * 0.015) * dt);
 const mBox = new THREE.Box3().setFromCenterAndSize(mNext, new THREE.Vector3(1.2, 2.5, 1.2));
 let mHit = false;
 for(let w of walls) {
 if(mBox.intersectsBox(new THREE.Box3().setFromObject(w))) { mHit = true; break; }
 }
 if(!mHit) m.position.copy(mNext);
 if(dist < 2.6) triggerJumpscare();
 }
 });

 // Rotate exit door
 if(exitDoor && exitDoor.visible) exitDoor.rotation.x += 0.01 * dt;

 keys.forEach((k) => {
 if(k.visible && camera.position.distanceTo(k.position) < 4) {
 k.visible = false;
 keyCount++;
 document.getElementById('keyCount').innerText = keyCount;
 showSubtitle("SLAB_RECOVERED [" + keyCount + "/3]");
 if(keyCount === 3) {
 exitAvailable = true;
 exitDoor.visible = true;
 showSubtitle("EXIT PORTAL ACTIVATED. FIND IT TO ESCAPE.");
 }
 }
 });

 if(exitAvailable && exitDoor && camera.position.distanceTo(exitDoor.position) < 5) {
 gameStarted = false;
 showSubtitle("CONNECTION RESTORED. SURVIVAL CONFIRMED. [MADE BY SHIVIN JINDAL]");
 setTimeout(() => location.reload(), 6000);
 }

 updateMinimap();
 }

 flashLight.position.copy(camera.position);
 const targetPos = new THREE.Vector3();
 camera.getWorldDirection(targetPos);
 flashLight.target.position.copy(camera.position).add(targetPos);
 renderer.render(scene, camera);
 }

 function triggerJumpscare() {
 if(isDead) return;
 isDead = true; gameStarted = false;
 document.exitPointerLock();
 document.getElementById('jumpscare').style.display = 'flex';
 setTimeout(() => location.reload(), 3500);
 }

 document.addEventListener('mousemove', e => {
 if(document.pointerLockElement) {
 camera.rotation.order = 'YXZ';
 camera.rotation.y -= e.movementX * 0.0022;
 camera.rotation.x -= e.movementY * 0.0022;
 camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x));
 }
 });

 window.onload = init;
 </script>
</body>
</html>
