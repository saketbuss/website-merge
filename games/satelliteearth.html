<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Satellite Earth Explorer - Ultra HD</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.100.0/Cesium.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.100.0/Widgets/widgets.min.css">
<style>
html,body,#app,#cesiumContainer{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Segoe UI,Tahoma,sans-serif}
#cesiumContainer.ai-on canvas{filter:contrast(1.15) saturate(1.2) brightness(1.04)}
.cesium-widget-credits,.cesium-viewer-animationContainer,.cesium-viewer-timelineContainer{display:none!important}
@keyframes scan{0%{transform:translateY(-100%);opacity:0}20%,80%{opacity:1}100%{transform:translateY(100vh);opacity:0}}
.scanline{animation:scan 1.6s linear infinite}
</style>
</head>
<body>
<div id="app" class="relative">
  <div class="absolute left-5 top-5 z-[1000] flex flex-col gap-2">
    <div class="flex gap-2">
      <input id="q" autocomplete="off" placeholder="Search a location..." class="w-72 rounded-xl border border-white/20 bg-black/70 px-4 py-3 text-white outline-none backdrop-blur">
      <button id="searchBtn" class="rounded-xl bg-blue-600 px-4 py-3 font-bold text-white">🔍</button>
    </div>
    <ul id="results" class="hidden max-h-56 w-72 overflow-y-auto rounded-xl border border-white/15 bg-black/80 text-sm text-white backdrop-blur"></ul>
  </div>
  <div class="absolute bottom-5 left-5 z-[1000] flex flex-col gap-2">
    <button id="zin" class="h-11 w-11 rounded-full border border-white/20 bg-black/70 text-2xl text-white">+</button>
    <button id="zout" class="h-11 w-11 rounded-full border border-white/20 bg-black/70 text-2xl text-white">-</button>
  </div>
  <div class="absolute bottom-5 right-5 z-[1000] flex flex-col gap-2">
    <button id="loc" class="h-11 w-11 rounded-full bg-red-600 text-white">🎯</button>
    <button id="ai" class="h-11 w-11 rounded-full bg-teal-600 text-white">✨</button>
    <button id="world" class="h-11 w-11 rounded-full border border-white/20 bg-black/70 text-white">🌍</button>
  </div>
  <div id="hud" class="pointer-events-none absolute inset-0 z-[900] hidden">
    <div class="absolute inset-0 bg-[linear-gradient(rgba(20,184,166,.18)_1px,transparent_1px),linear-gradient(90deg,rgba(20,184,166,.18)_1px,transparent_1px)] bg-[length:40px_40px]"></div>
    <div class="scanline absolute left-0 top-0 h-1 w-full bg-teal-400 shadow-[0_0_24px_rgba(45,212,191,1)]"></div>
    <div class="absolute bottom-16 left-1/2 -translate-x-1/2 rounded-full border border-teal-400 bg-black/75 px-5 py-2 font-mono text-sm tracking-wider text-teal-300">AI ENHANCE ACTIVE</div>
  </div>
  <div id="cesiumContainer"></div>
</div>
<script>
const viewer=new Cesium.Viewer('cesiumContainer',{
  imageryProvider:new Cesium.UrlTemplateImageryProvider({url:'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',maximumLevel:23,credit:'Google'}),
  baseLayerPicker:false,animation:true,timeline:false,geocoder:false,homeButton:true,sceneModePicker:false,navigationHelpButton:true,fullscreenButton:false,infoBox:true,selectionIndicator:true,scene3DOnly:true
});
viewer.resolutionScale=window.devicePixelRatio||1;
viewer.scene.globe.enableLighting=true;
viewer.scene.highDynamicRange=true;
viewer.scene.postProcessStages.fxaa.enabled=true;
viewer.scene.screenSpaceCameraController.minimumZoomDistance=5;
viewer.scene.screenSpaceCameraController.zoomEventTypes=[Cesium.CameraEventType.RIGHT_DRAG,Cesium.CameraEventType.WHEEL,Cesium.CameraEventType.PINCH];
const container=document.getElementById('cesiumContainer'),q=document.getElementById('q'),results=document.getElementById('results'),hud=document.getElementById('hud');
function fly(lat,lon,h=4000){viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,h),orientation:{heading:0,pitch:Cesium.Math.toRadians(-60),roll:0},duration:2.5});results.classList.add('hidden');results.innerHTML='';}
let t;
q.addEventListener('input',()=>{clearTimeout(t);const term=q.value.trim();if(term.length<3){results.classList.add('hidden');results.innerHTML='';return;}t=setTimeout(async()=>{try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(term)}&limit=5`);const data=await r.json();results.innerHTML='';if(!data.length){results.classList.add('hidden');return;}results.classList.remove('hidden');for(const item of data){const li=document.createElement('li');li.className='cursor-pointer border-b border-white/10 px-4 py-3 hover:bg-white/10 last:border-b-0';li.textContent=item.display_name;li.onclick=()=>{q.value=item.display_name.split(',')[0];let h=500;if(item.type==='city'||item.type==='administrative')h=18000;if(item.type==='country')h=4000000;fly(+item.lat,+item.lon,h);};results.appendChild(li);}}catch(e){console.error(e);}},350);});
document.getElementById('searchBtn').onclick=async()=>{if(!q.value.trim())return;const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q.value)}&limit=1`);const data=await r.json();if(data[0]){let h=500;if(data[0].type==='city'||data[0].type==='administrative')h=18000;if(data[0].type==='country')h=4000000;fly(+data[0].lat,+data[0].lon,h);}};
q.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('searchBtn').click();});
document.addEventListener('click',e=>{if(!q.contains(e.target)&&!results.contains(e.target))results.classList.add('hidden');});
document.getElementById('zin').onclick=()=>viewer.camera.zoomIn(viewer.camera.positionCartographic.height*.5);
document.getElementById('zout').onclick=()=>viewer.camera.zoomOut(viewer.camera.positionCartographic.height*.5);
document.getElementById('world').onclick=()=>viewer.camera.flyHome(2);
document.getElementById('loc').onclick=()=>{if(!navigator.geolocation){alert('Geolocation is not supported in this browser.');return;}navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude}=pos.coords;viewer.entities.removeAll();viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(longitude,latitude),point:{pixelSize:16,color:Cesium.Color.RED,outlineColor:Cesium.Color.WHITE,outlineWidth:3},label:{text:'You are here!',font:'bold 14pt sans-serif',style:Cesium.LabelStyle.FILL_AND_OUTLINE,fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,verticalOrigin:Cesium.VerticalOrigin.BOTTOM,pixelOffset:new Cesium.Cartesian2(0,-20)}});fly(latitude,longitude,450);},()=>alert('Could not get your location.'));};
let aiOn=false;document.getElementById('ai').onclick=()=>{aiOn=!aiOn;container.classList.toggle('ai-on',aiOn);hud.classList.toggle('hidden',!aiOn);};
container.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
</script>
</body>
</html>
