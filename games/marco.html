 class SnakeGame {

 class PongGame {

 draw(ctx) { ctx.fillStyle='#0f172a';ctx.fillRect(0,0,800,450);ctx.fillStyle='#475569';ctx.font='60px "Press Start 2P"';ctx.fillText(this.score,170,80);ctx.fillText(this.aiScore,570,80); ctx.fillStyle='#3b82f6';ctx.fillRect(30,this.py,15,80);ctx.fillStyle='#ef4444';ctx.fillRect(755,this.ay,15,80);ctx.fillStyle='#fff';ctx.fillRect(this.b.x,this.b.y,10,10); }

 class BreakerGame {

 update(k) { if((k['ArrowLeft']||k['KeyA'])&&this.px>0)this.px-=8;if((k['ArrowRight']||k['KeyD'])&&this.px<700)this.px+=8; this.b.x+=this.b.dx;this.b.y+=this.b.dy; if(this.b.x<6||this.b.x>794)this.b.dx*=-1;if(this.b.y<6)this.b.dy*=-1;if(this.b.y>450)this.isGameOver=true; if(this.b.y+6>=420&&this.b.x>=this.px&&this.b.x<=this.px+100){this.b.dy=-Math.abs(this.b.dy);this.b.dx=(this.b.x-(this.px+50))*0.15;} let active=0;this.br.forEach(br=>{if(br.a){active++;if(this.b.x>br.x&&this.b.x<br.x+br.w&&this.b.y>br.y&&this.b.y<br.y+br.h){this.b.dy*=-1;br.a=false;this.score+=10;}}}); if(active===0)this.isGameWon=true; }

 class DefenderGame {

 update(k,m) { this.fc++;let spawnRate=Math.max(20,60-Math.floor(this.score/5));if(this.fc%spawnRate===0)this.m.push({x:Math.random()*680+60,y:Math.random()*330+60,l:80});for(let i=this.m.length-1;i>=0;i--){let o=this.m[i];o.l--;if(m.clicked&&Math.hypot(m.x-o.x,m.y-o.y)<35){this.score++;this.m.splice(i,1);}else if(o.l<=0){this.lives--;this.m.splice(i,1);if(this.lives<=0)this.isGameOver=true;}} }
 draw(ctx) { ctx.fillStyle='#0f172a';ctx.fillRect(0,0,800,450);this.m.forEach(o=>{ctx.fillStyle='#334155';ctx.beginPath();ctx.arc(o.x,o.y,35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f97316';ctx.beginPath();ctx.arc(o.x,o.y,30*(o.l/80),0,Math.PI*2);ctx.fill();});ctx.fillStyle='#fff';ctx.font='20px "Press Start 2P"';ctx.fillText(`SCORE: ${this.score} LIVES: ${this.lives}`,10,30); }
 }
 class DashGame {
 constructor() { this.start(); }
 start() { this.isGameOver=false;this.score=0;this.y=380;this.v=0;this.j=false;this.obs=[];this.fc=0;this.spd=7; }
 update(k) { this.fc++;this.score++;if(this.fc%500===0)this.spd++;if((k['Space']||k['ArrowUp']||k['KeyW'])&&!this.j){this.v=-13;this.j=true;}this.v+=0.7;this.y+=this.v;if(this.y>=380){this.y=380;this.j=false;this.v=0;}if(this.fc%Math.max(40,Math.floor(100-this.spd*4))===0&&Math.random()>0.3)this.obs.push({x:800});for(let i=this.obs.length-1;i>=0;i--){let o=this.obs[i];o.x-=this.spd;if(Math.abs(o.x-100)<20&&this.y>350)this.isGameOver=true;if(o.x<-50)this.obs.splice(i,1);} }
 draw(ctx) { ctx.fillStyle='#0f172a';ctx.fillRect(0,0,800,450);ctx.fillStyle='#475569';ctx.fillRect(0,400,800,50);ctx.fillStyle='#d946ef';ctx.fillRect(100,this.y,20,20);ctx.fillStyle='#f43f5e';this.obs.forEach(o=>{ctx.beginPath();ctx.moveTo(o.x,400);ctx.lineTo(o.x+10,370);ctx.lineTo(o.x+20,400);ctx.fill();});ctx.fillStyle='#fff';ctx.font='20px "Press Start 2P"';ctx.fillText(`DIST: ${Math.floor(this.score/10)}M`,10,30); }
 }
 class TypingGame {
 constructor() { this.start(); }
 start() { this.isGameOver=false;this.score=0;this.lives=3;this.w=[];this.fc=0; }
 update(k) { this.fc++;if(this.fc%Math.max(20,70-Math.floor(this.score/3))===0){let l=String.fromCharCode(65+Math.floor(Math.random()*26));this.w.push({c:l,x:Math.random()*700+50,y:-20});}for(let i=this.w.length-1;i>=0;i--){let w=this.w[i];w.y+=2+this.score/20;if(k['Key'+w.c]){this.score++;this.w.splice(i,1);k['Key'+w.c]=false;break;}else if(w.y>450){this.lives--;this.w.splice(i,1);if(this.lives<=0)this.isGameOver=true;}} }
 draw(ctx) { ctx.fillStyle='#0f172a';ctx.fillRect(0,0,800,450);ctx.font='28px "Press Start 2P"';this.w.forEach(w=>{ctx.fillStyle='#06b6d4';ctx.fillText(w.c,w.x,w.y);});ctx.fillStyle='#fff';ctx.font='20px "Press Start 2P"';ctx.fillText(`SCORE: ${this.score} LIVES: ${this.lives}`,10,30); }
 }
 class CatchGame {
 constructor() { this.start(); }
 start() { this.isGameOver=false;this.score=0;this.px=350;this.obj=[];this.fc=0; }
 update(k) { if((k['ArrowLeft']||k['KeyA'])&&this.px>0)this.px-=9;if((k['ArrowRight']||k['KeyD'])&&this.px<700)this.px+=9;this.fc++;if(this.fc%30===0)this.obj.push({x:Math.random()*760+20,y:-20,bad:Math.random()>0.75});for(let i=this.obj.length-1;i>=0;i--){let o=this.obj[i];o.y+=5+this.score/10;if(o.y>400&&o.y<430&&o.x+10>this.px&&o.x-10<this.px+100){if(o.bad)this.isGameOver=true;else{this.score++;this.obj.splice(i,1);}}else if(o.y>450){if(!o.bad)this.isGameOver=true;this.obj.splice(i,1);}} }
 draw(ctx) { ctx.fillStyle='#0f172a';ctx.fillRect(0,0,800,450);ctx.fillStyle='#9ca3af';ctx.fillRect(this.px,420,100,15);this.obj.forEach(o=>{ctx.fillStyle=o.bad?'#ef4444':'#22c55e';ctx.beginPath();ctx.arc(o.x,o.y,12,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#fff';ctx.font='20px "Press Start 2P"';ctx.fillText(`CATCHED: ${this.score}`,10,30); }
 }
 </script>
